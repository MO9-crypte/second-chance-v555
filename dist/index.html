<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Chance: Space Mission Rescue</title>
<meta name="description" content="Real NASA missions failed. Investigate, redesign the spacecraft and fly it again with Orbi, your robot assistant. 1 to 4 players, all ages, English and Arabic.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='12' fill='%23C9C2FF' stroke='%231B1650' stroke-width='2'/%3E%3Crect x='9' y='12' width='14' height='9' rx='4' fill='%231B1650'/%3E%3Ccircle cx='13' cy='16.5' r='1.8' fill='%233DDBA4'/%3E%3Ccircle cx='19' cy='16.5' r='1.8' fill='%233DDBA4'/%3E%3Ccircle cx='16' cy='3' r='2' fill='%23FFC83D'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0C0A2E; --bg2:#231C66; --card:#2B2380; --card2:#3A2F9E; --ink:#1B1650; --deep:#140F45;
  --white:#FFFFFF; --lav:#C9C2FF; --soft:#E4E0FF; --sun:#FFC83D; --mint:#3DDBA4; --pink:#FF6FA5; --sky:#4FC3F7; --red:#FF5A5F; --mars:#F26B3A;
  --font:"Baloo Bhaijaan 2","Segoe UI",system-ui,-apple-system,Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;color:var(--white);font:17px/1.5 var(--font);
  background:radial-gradient(1200px 700px at 80% -10%,#3B2FA8 0,transparent 60%),radial-gradient(900px 600px at -10% 110%,#3A1E7A 0,transparent 55%),linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff 50%,transparent 51%),radial-gradient(1px 1px at 120px 80px,#fff 50%,transparent 51%),radial-gradient(2px 2px at 200px 160px,#FFC83D 50%,transparent 51%),radial-gradient(1px 1px at 300px 40px,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 360px 220px,#C9C2FF 50%,transparent 51%);
  background-size:400px 260px}
h1,h2,h3{line-height:1.15;margin:0 0 .4em;font-weight:800}
h1{font-size:clamp(30px,4.4vw,46px)} h2{font-size:clamp(22px,2.6vw,28px)} h3{font-size:20px}
p{margin:0 0 .7em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.muted{color:var(--lav)} .small{font-size:14.5px} .ok{color:var(--mint)} .bad{color:#FF9A9D}
.wrap{max-width:1240px;margin:0 auto;padding:22px 22px 230px}
[hidden]{display:none!important}

/* buttons */
.big-btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;background:var(--sun);color:var(--ink);border:3px solid var(--ink);border-radius:18px;
  padding:.55em 1.3em;font-weight:800;font-size:22px;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.big-btn:hover{filter:brightness(1.06)} .big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.big-btn.sm{font-size:18px;padding:.45em 1.1em}
.big-btn.alt{background:var(--white)}
.big-btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.big-btn.launch{font-size:30px;padding:.5em 1.8em;background:var(--red);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.btn{background:transparent;border:3px solid var(--lav);border-radius:14px;padding:.4em 1em;font-weight:700;cursor:pointer;color:var(--white)}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.ghost{border-color:transparent;color:var(--lav)}
.chip{background:var(--card2);border:2px solid var(--ink);border-radius:999px;padding:.15em .8em;font-weight:700;cursor:pointer;font-size:15px}
.chip.on,.chip.next{background:var(--sun);color:var(--ink)}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;background:rgba(12,10,46,.88);backdrop-filter:blur(8px);border-bottom:3px solid var(--ink)}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;font-weight:800;font-size:21px;cursor:pointer;white-space:nowrap}
.logo-dot{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--lav));border:3px solid var(--ink);box-shadow:8px -6px 0 -4px var(--sun)}
.chapters{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none}
.chapters li{display:flex;align-items:center;gap:5px;padding:4px 12px;border-radius:999px;color:var(--lav);font-weight:700;font-size:15px;white-space:nowrap;border:2px solid transparent}
.chapters li.done{color:var(--mint)}
.chapters li.on{background:var(--sun);color:var(--ink);border-color:var(--ink)}
.tools{display:flex;gap:8px;margin-inline-start:auto}
.tool{width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);background:var(--card2);font-weight:800;cursor:pointer;font-size:18px}

/* title */
.title-screen{max-width:1240px;margin:0 auto;padding:30px 22px 230px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:30px;align-items:center;margin-bottom:28px}
.kicker{color:var(--sun);font-weight:800;margin:0 0 4px}
.hero h1{font-size:clamp(54px,9vw,110px);line-height:.95;margin:0 0 12px;text-shadow:0 6px 0 var(--ink)}
.lede{font-size:clamp(19px,2vw,24px);color:var(--soft);max-width:30ch;margin-bottom:22px}
.hero-orbi{position:relative;justify-self:center;width:min(330px,80%)}
.hero-orbi .orbi-svg{width:100%;height:auto;animation:float 3.5s ease-in-out infinite}
.hero-say{position:absolute;top:-10px;inset-inline-start:-40%;background:#fff;color:var(--ink);padding:10px 14px;border-radius:18px;border:3px solid var(--ink);font-weight:700;max-width:230px;box-shadow:0 5px 0 var(--ink)}
.setup{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:20px 22px;box-shadow:0 7px 0 var(--deep)}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.seg button{background:var(--card2);border:3px solid var(--ink);border-radius:14px;padding:.35em .9em;font-weight:700;cursor:pointer}
.seg button.on{background:var(--sun);color:var(--ink)}
.names{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.pname{display:flex;align-items:center;gap:8px;background:var(--deep);border-radius:14px;padding:4px 8px;border:2px solid var(--ink)}
.pname span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--ink);font-weight:800;flex:none}
.pname input{background:transparent;border:0;width:100%;padding:4px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.rolepick{display:flex;align-items:center;gap:8px;background:var(--card2);border-radius:14px;padding:6px 10px;border:2px solid var(--ink);flex-wrap:wrap}
.rolepick .re{font-size:22px}.rolepick .rn{font-weight:700;flex:1}
.rolepick select{background:var(--deep);border:2px solid var(--ink);border-radius:10px;padding:2px 6px}
.modes{display:grid;gap:10px}
.mode{text-align:start;background:var(--card2);border:3px solid var(--ink);border-radius:18px;padding:12px 16px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;column-gap:12px}
.mode b{font-size:20px}.mode span{color:var(--sun);font-weight:700;align-self:center}.mode small{grid-column:1/-1;color:var(--soft);font-size:15px}
.mode.on{background:var(--sun);color:var(--ink)}.mode.on span,.mode.on small{color:var(--ink)}
@media (max-width:860px){.hero,.setup{grid-template-columns:1fr}.hero-say{position:static;margin:0 auto 10px}}

/* cases */
.cases-head{text-align:center;margin:10px 0 24px}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.case{position:relative;display:flex;flex-direction:column;text-align:start;background:#F3E9CF;color:var(--ink);border:3px solid var(--ink);border-radius:22px;padding:0;overflow:hidden;cursor:pointer;box-shadow:0 8px 0 var(--deep);transition:transform .15s}
.case:hover{transform:translateY(-4px) rotate(-.6deg)}
.case-art{display:block;background:linear-gradient(180deg,#1A1560,#2B2380);border-bottom:3px solid var(--ink);aspect-ratio:200/120}
.case-art svg{width:100%;height:100%;display:block}
.case.open{background:#DFF8EE}
.stamp{position:absolute;top:12px;inset-inline-end:12px;transform:rotate(-10deg);border:3px solid var(--red);color:var(--red);background:rgba(255,255,255,.85);font-weight:800;padding:0 10px;border-radius:8px;font-size:16px}
.case.open .stamp{border-color:#1F9E6E;color:#1F9E6E}
.case-body{display:flex;flex-direction:column;padding:14px 16px 14px;flex:1}
.no{font-size:14px;opacity:.7;font-weight:700}
.case-title{font-size:24px;font-weight:800;line-height:1.15;margin:2px 0 6px}
.teaser{font-size:15.5px;line-height:1.4;margin-bottom:10px}
.case-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.stars{display:flex;gap:2px}.stars svg{width:26px;height:26px}
.mini-badge{font-size:24px}

/* mission scaffolding */
.scene-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 10px}
.scene-head h1{margin:0;flex:1 1 auto}
.yr{font-size:.55em;color:var(--lav)}
.roletag{display:inline-flex;gap:6px;align-items:center;background:var(--rc,#C9C2FF);color:var(--ink);font-weight:700;border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:15px}
.subs{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 18px;flex-wrap:wrap;counter-reset:s}
.subs li{counter-increment:s;padding:3px 12px 3px 6px;border-radius:999px;background:var(--card);border:2px solid var(--ink);color:var(--lav);font-weight:700;font-size:14.5px}
.subs li::before{content:counter(s);display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--card2);margin-inline-end:6px;font-size:13px}
.subs li.on{background:var(--sun);color:var(--ink)} .subs li.on::before{background:#fff}
.subs li.done{color:var(--mint)} .subs li.done::before{content:"✓";background:var(--mint);color:var(--ink)}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.missing{color:var(--sun);font-weight:700;font-size:15px}
.sec{margin-top:18px}

/* cinematic & investigation */
.cine{position:relative;border:4px solid var(--ink);border-radius:24px;overflow:hidden;box-shadow:0 8px 0 var(--deep);background:#0C0A2E}
.cine canvas{display:block;width:100%;aspect-ratio:16/9}
.intro-art{border:4px solid var(--ink);border-radius:24px;overflow:hidden;background:linear-gradient(#4FC3F7,#BFE9FF);max-width:860px;margin:0 auto}
.intro-art svg{display:block;width:100%}
.counter{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:3px 14px;font-weight:700}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px;padding:26px;border-radius:26px;border:4px solid var(--ink);
  background:repeating-linear-gradient(45deg,#3B2B6E 0 12px,#36286A 12px 24px);box-shadow:inset 0 0 0 6px #2A1F55}
.clue{position:relative;border:3px solid var(--ink);border-radius:14px;background:#FFF8E1;color:var(--ink);padding:16px 14px 14px;min-height:190px;cursor:pointer;text-align:start;transform:rotate(var(--r));box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .2s}
.clue:hover{transform:rotate(0) scale(1.03)}
.clue .tape{position:absolute;top:-10px;inset-inline-start:40%;width:60px;height:18px;background:rgba(255,200,61,.8);transform:rotate(-4deg)}
.clue-front,.clue-back{display:flex;flex-direction:column;gap:6px}
.clue-ic svg{width:64px;height:64px}
.clue-n{font-size:14px;font-weight:800;color:#7A6FD0}.clue-t{font-weight:800;font-size:18px;line-height:1.2}
.tap{margin-top:auto;font-size:14px;color:#7A6FD0}
.clue-back{display:none}.clue.open .clue-front{display:none}.clue.open .clue-back{display:flex}
.clue.open{background:#fff}
.clue-body{font-size:15.5px;line-height:1.45;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
[dir=rtl] .clue-body{font-family:var(--font)}
.solve{margin-top:24px;background:var(--card);border:4px solid var(--sun);border-radius:24px;padding:20px 22px;box-shadow:0 8px 0 var(--deep)}
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.answer{background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:14px;font-weight:700;font-size:17px;cursor:pointer;text-align:start;box-shadow:0 5px 0 var(--ink)}
.answer:hover{background:#FFF4CC}.answer[disabled]{opacity:.5;text-decoration:line-through}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.solved{margin-top:24px;display:flex;gap:22px;align-items:center;background:var(--card);border:4px solid var(--mint);border-radius:24px;padding:20px 24px;flex-wrap:wrap}
.badge-big svg{width:150px;height:150px;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1)}}

/* objective */
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.goal{display:flex;flex-direction:column;gap:4px;text-align:start;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:16px;cursor:pointer;box-shadow:0 6px 0 var(--deep)}
.goal .gem{font-size:40px;line-height:1}.goal b{font-size:19px}.goal span:last-child{color:var(--soft);font-size:15.5px}
.goal.small{padding:12px}.goal.small .gem{font-size:28px}
.goal.on{background:var(--sun);color:var(--ink)}.goal.on span:last-child{color:var(--ink)}
.rules{margin-top:22px;background:#FFF8E1;color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:16px 20px}
.rules ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.rules li{display:flex;gap:10px;align-items:baseline}
.vb{background:var(--ink);color:#fff;border-radius:999px;padding:0 10px;font-size:13.5px;font-weight:700;white-space:nowrap}

/* build */
.build{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:980px){.build{grid-template-columns:1fr}}
.stage{position:sticky;top:84px;background:radial-gradient(circle at 50% 40%,#3A2F9E,#1A1560 70%);border:4px solid var(--ink);border-radius:26px;padding:14px;box-shadow:0 8px 0 var(--deep);transition:box-shadow .15s}
@media (max-width:980px){.stage{position:static}}
.stage.over{box-shadow:0 0 0 6px var(--sun),0 8px 0 var(--deep)}
.stage.pop .stage-svg{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.03)}}
.stage-tip{text-align:center;color:var(--lav);font-weight:700;font-size:14.5px}
.stage-svg{display:block;width:100%;height:auto}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;margin:8px 0 6px;background:rgba(12,10,46,.55);border-radius:16px;padding:10px 12px;border:2px solid var(--ink)}
.meter .mt{display:flex;justify-content:space-between;gap:6px;font-size:14px;font-weight:700}
.meter .mv{color:var(--soft);font-weight:600;font-size:13px;white-space:nowrap}
.mbar{height:12px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;border:2px solid var(--ink);margin-top:3px}
.mbar i{display:block;height:100%;background:var(--mint);border-radius:999px;transition:width .3s}
.meter.warn .mbar i{background:var(--sun)}.meter.nogo .mbar i{background:var(--red)}.meter.wait .mbar i{background:#7F78C9}
.meter.nogo .mt{color:#FFB3B5}
.crit{color:var(--sun);margin-inline-start:4px}
.tray{background:var(--card);border:3px solid var(--ink);border-radius:24px;padding:14px;box-shadow:0 7px 0 var(--deep)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tab{background:var(--card2);border:2px solid var(--ink);border-radius:12px;padding:5px 10px;font-weight:700;cursor:pointer;font-size:15px}
.tab.on{background:var(--sun);color:var(--ink)}.tab.done:not(.on){color:var(--mint)}
.slot-info{margin:0 0 10px}.slot-info b{font-size:19px;margin-inline-end:6px}
.parts{display:grid;gap:10px}
.part-card{display:grid;grid-template-columns:78px 1fr auto;gap:12px;align-items:center;background:var(--card2);border:3px solid var(--ink);border-radius:18px;padding:10px;cursor:grab;user-select:none}
.part-card.on{background:#FFF4CC;color:var(--ink)}
.part-card .pic{width:78px;height:78px;background:rgba(255,255,255,.9);border-radius:14px;border:2px solid var(--ink);display:grid;place-items:center}
.part-card .pic svg{width:64px;height:64px}
.pinfo b{font-size:17.5px;display:block;line-height:1.2}.pinfo p{margin:2px 0 0;font-size:14.5px;opacity:.9}
.pstats{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13.5px;font-weight:700;opacity:.9;margin-top:3px}
.ptags{font-size:13px;margin-top:3px;opacity:.85}
.hist{display:inline-block;margin-top:5px;font-size:12.5px;font-weight:700;background:rgba(255,200,61,.25);border:1.5px dashed var(--sun);border-radius:999px;padding:0 8px}
.part-card.on .hist{background:rgba(27,22,80,.08);border-color:var(--ink)}
.add{background:var(--mint);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:.35em .9em;font-weight:800;cursor:pointer;box-shadow:0 4px 0 var(--ink);white-space:nowrap}
.add.on{background:#fff}
.drag-ghost{position:fixed;z-index:60;width:84px;height:84px;margin:-42px 0 0 -42px;pointer-events:none;background:#fff;border:3px solid var(--ink);border-radius:18px;display:grid;place-items:center;transform:rotate(-6deg);box-shadow:0 10px 20px rgba(0,0,0,.4)}
.drag-ghost svg{width:70px;height:70px}
body.dragging{cursor:grabbing}
@media (max-width:560px){.part-card{grid-template-columns:60px 1fr}.part-card .pic{width:60px;height:60px}.part-card .pic svg{width:50px;height:50px}.add{grid-column:1/-1}}

/* choices (orbit, rocket, tests) */
.pick-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:8px}
.choice{display:flex;flex-direction:column;gap:4px;text-align:start;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:12px 14px 14px;cursor:pointer;box-shadow:0 6px 0 var(--deep);position:relative}
.choice .cart{display:grid;place-items:center;height:118px;background:rgba(12,10,46,.55);border-radius:14px;border:2px solid var(--ink);margin-bottom:6px}
.choice .cart svg{height:108px;width:auto;max-width:100%}
.choice b{font-size:18px;line-height:1.2}.choice .cd{font-size:14.5px;color:var(--soft)}
.choice.on{background:var(--sun);color:var(--ink)}.choice.on .cd{color:var(--ink)}.choice.on .cart{background:rgba(255,255,255,.6)}
.choice.test .cart{height:90px}.choice.test .cart svg{height:72px}
.tick{margin-top:auto;font-weight:800;font-size:15px}
.capbar{height:10px;border-radius:999px;background:rgba(255,255,255,.18);border:2px solid var(--ink);overflow:hidden;margin-top:6px}
.capbar i{display:block;height:100%;background:var(--mint)}.capbar i.over{background:var(--red)}
.choice.on .ok{color:#0B7A52}.choice.on .bad{color:#B3261E}

/* poll */
.vchips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media (max-width:700px){.vchips{grid-template-columns:repeat(2,1fr)}}
.vchip{display:flex;align-items:center;gap:8px;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:8px 10px;font-size:14.5px}
.vchip span{font-size:22px}.vchip b{flex:1;line-height:1.15}.vchip i{font-style:normal;font-weight:800}
.vchip.go{background:var(--mint);color:var(--ink)}.vchip.nogo{background:var(--red)}
.pollcard{background:var(--card);border:4px solid var(--rc);border-radius:26px;padding:20px 22px;box-shadow:0 8px 0 var(--deep);max-width:820px;margin:0 auto}
.pc-head{display:flex;gap:14px;align-items:center}.pe{font-size:54px}
.checks{list-style:none;padding:0;margin:14px 0;display:grid;gap:10px}
.checks li{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border-radius:14px;padding:8px 12px;border:2px solid var(--ink)}
.checks li span span{display:block;font-size:14.5px;color:var(--soft)}
.dot{width:16px;height:16px;border-radius:50%;background:var(--mint);border:2px solid var(--ink);flex:none;margin-top:5px}
.checks li.warn .dot{background:var(--sun)}.checks li.nogo .dot{background:var(--red)}.checks li.wait .dot{background:#7F78C9}
.vote-row{display:flex;gap:14px;justify-content:center}
.vote{font-size:28px;font-weight:800;border:4px solid var(--ink);border-radius:20px;padding:.3em 1.4em;cursor:pointer;box-shadow:0 6px 0 var(--ink)}
.vote.go{background:var(--mint);color:var(--ink)}.vote.nogo{background:var(--red);color:#fff}
.vote[disabled]{opacity:.35;cursor:not-allowed}
.verdict{text-align:center;background:var(--card);border:4px solid var(--ink);border-radius:26px;padding:26px;max-width:720px;margin:0 auto;box-shadow:0 8px 0 var(--deep)}
.verdict.go{border-color:var(--mint)}.verdict.nogo{border-color:var(--red)}

/* flight */
.flight{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
@media (max-width:980px){.flight{grid-template-columns:1fr}}
.clock{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:3px 14px;font-weight:700;font-variant-numeric:tabular-nums}
.decision-wrap{position:absolute;inset:auto 12px 12px 12px}
.decision{background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:22px;padding:14px 16px;box-shadow:0 8px 0 var(--ink);animation:pop .35s}
.dlabel{font-weight:800;color:#7A6FD0;font-size:14.5px}.decision p{font-size:19px;font-weight:700;margin:4px 0 10px}
.dopts{display:flex;flex-wrap:wrap;gap:10px}.dopts .big-btn{flex:1 1 220px}
.logbox{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:14px;box-shadow:0 7px 0 var(--deep)}
.log{list-style:none;margin:0;padding:0 4px 0 0;max-height:430px;overflow:auto;display:grid;gap:8px}
.log li{background:var(--card2);border-radius:12px;padding:6px 10px;border-inline-start:5px solid var(--lav);font-size:14.5px;line-height:1.4}
.log li.good{border-color:var(--mint)}.log li.warn{border-color:var(--sun)}.log li.bad{border-color:var(--red)}
.log .t{display:block;font-size:12.5px;color:var(--lav);font-weight:700}
.speed{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* case closed */
.closed-top{text-align:center;margin:6px 0 20px}
.stars-big{display:flex;justify-content:center;gap:10px}
.sb svg{width:84px;height:84px}.sb.on svg{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;animation-delay:var(--d)}
.total{font-size:58px;font-weight:800;line-height:1;margin:2px 0}.total small{font-size:22px;color:var(--lav)}
.earned{display:inline-flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:4px 16px 4px 6px;font-weight:800}
.earned svg{width:46px;height:46px}
.atts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.att{background:var(--card);border-radius:999px;padding:2px 12px;font-size:14px;border:2px solid var(--ink)}
.closed-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.sbar{display:grid;grid-template-columns:150px 1fr 36px;gap:10px;align-items:center;margin-bottom:9px;font-weight:700;font-size:15px}
.keys{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.keys li{display:grid;grid-template-columns:26px 1fr;gap:6px;font-size:15px;line-height:1.35}
.keys li span span{display:block;color:var(--soft);font-size:14px}
.mk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2px solid var(--ink)}
.keys li.ok .mk{background:var(--mint);color:var(--ink)}.keys li.no .mk{background:var(--red)}
.casefile{position:relative;background:#F3E9CF;color:var(--ink);border:4px solid var(--ink);border-radius:24px;padding:26px 26px 20px;margin-top:26px;box-shadow:0 8px 0 var(--deep)}
.casefile p{max-width:80ch;font-size:17px}
.casefile table{border-collapse:collapse;width:100%;margin:10px 0;font-size:15.5px}
.casefile th,.casefile td{text-align:start;padding:8px;border-bottom:2px solid rgba(27,22,80,.15)}
.casefile th{opacity:.7}
.stamp.big{font-size:22px;top:20px;background:transparent}
.verdict-line{font-weight:800;font-size:20px}.verdict-line.bad{color:#B3261E}.verdict-line.ok{color:#0B7A52}
.lesson{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;font-weight:700}
.src{font-size:13.5px;opacity:.75}

/* overlays */
#overlay{position:fixed;inset:0;z-index:70;background:rgba(12,10,46,.82);display:grid;place-items:center;padding:20px}
.handoff{background:var(--card);border:5px solid var(--rc);border-radius:28px;padding:26px 34px;text-align:center;max-width:420px;box-shadow:0 10px 0 var(--deep);animation:pop .35s}
.ho-em{font-size:70px}.handoff h2{font-size:40px;margin:0}.ho-role{color:var(--rc);font-weight:800;font-size:20px}
.count span{font-size:min(30vw,220px);font-weight:800;color:var(--sun);text-shadow:0 10px 0 var(--ink);animation:pop .5s}

/* Orbi dock */
#orbi{position:fixed;bottom:14px;inset-inline-start:14px;z-index:40;display:flex;align-items:flex-end;gap:6px;pointer-events:none;max-width:min(560px,calc(100vw - 28px))}
#orbi > *{pointer-events:auto}
.orbi-face{background:none;border:0;padding:0;cursor:pointer;width:118px;flex:none}
.orbi-svg{width:118px;height:auto;display:block}
.orbi-svg .hover{animation:float 3s ease-in-out infinite;transform-origin:center}
@keyframes float{50%{transform:translateY(-6px)}}
.orbi-svg .flame{animation:flick .25s infinite alternate;transform-origin:60px 111px}
@keyframes flick{to{transform:scaleY(.6)}}
.orbi-svg .tip{animation:blink 1.6s infinite}@keyframes blink{50%{opacity:.4}}
#orbi.talking .mouth{animation:talk .18s infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes talk{to{transform:scaleY(.35)}}
.bubble{position:relative;background:#fff;color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:10px 14px 10px;box-shadow:0 6px 0 var(--ink);margin-bottom:46px;min-width:220px}
.bubble::before{content:"";position:absolute;bottom:18px;inset-inline-start:-14px;border:10px solid transparent;border-inline-end-color:var(--ink)}
.bubble.hide{display:none}
.bubble .who{font-weight:800;color:#7A6FD0;font-size:13px}
.bubble p{margin:0 0 6px;font-size:16.5px;line-height:1.4;font-weight:600;min-height:1.4em}
.bubble-row{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.bubble .chip{background:#EEEAFF;color:var(--ink);font-size:14px}.bubble .chip.next{background:var(--sun)}
@media (max-width:640px){.orbi-face,.orbi-svg{width:78px}.bubble{margin-bottom:24px;min-width:0}.bubble p{font-size:15px}.wrap,.title-screen{padding-bottom:260px}.top{flex-wrap:wrap;gap:8px}.chapters{order:3;flex-basis:100%;justify-content:flex-start}.chapters .nm{display:none}.chapters li.on .nm{display:inline}}

@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

body.on-title #orbi{display:none}

/* level challenges & report */
.chal-card{margin-top:22px;background:linear-gradient(135deg,#3A2F9E,#2B2380);border:3px solid var(--sun);border-radius:20px;padding:16px 20px}
.chal-card ol{margin:6px 0;padding-inline-start:1.3em}.chal-card li{margin-bottom:4px;font-weight:600}
.lvl{margin:0 0 8px;color:var(--lav)}
.sbar{grid-template-columns:150px 1fr 36px 40px!important}
.sbar em{font-style:normal;font-size:13px;font-weight:800}.sbar em.up{color:var(--mint)}.sbar em.down{color:#FF9A9D}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{display:flex;flex-direction:column;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:12px 14px;box-shadow:0 5px 0 var(--deep)}
.tile .te{font-size:24px}.tile b{font-size:28px;line-height:1.1}.tile span{font-weight:700}.tile small{color:var(--lav);font-size:13px}
.chart{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--lav);margin-top:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.legend i.dash{background:repeating-linear-gradient(90deg,#C9C2FF 0 4px,transparent 4px 7px);height:3px;vertical-align:3px}
.card.team{margin:18px 0}
.tablewrap{overflow-x:auto}
.roles-t{border-collapse:collapse;width:100%;font-size:15px;min-width:560px}
.roles-t th,.roles-t td{text-align:start;padding:8px;border-bottom:2px solid rgba(255,255,255,.1)}
.roles-t th{color:var(--lav);font-size:13.5px}
.share{margin-top:12px;max-width:520px}
.plain{margin:0;padding-inline-start:1.2em;display:grid;gap:8px}.plain li{line-height:1.45}
.closed-grid{margin-bottom:18px}
canvas { direction: ltr; }

const MISSIONS = [
/* ------------------------------ 1. MCO -------------------------------- */
{
  id: "mco", no: 1, title: B("Mars Climate Orbiter", "مسبار مناخ المريخ"), years: "1998–1999", stamp: B("LOST 1999", "فُقد 1999"),

      else { const big = pw.flags && pw.flags.big; g += `<g class="part" data-part="power">${panelRect(big ? 70 : 96, 140, big ? 280 : 228, 26)}${pw.flags && pw.flags.tilt ? `<path d="M96 140 l-14 -16 M324 140 l14 -16" stroke="${PAL.ink}" stroke-width="3"/>` : ""}</g>`; } }

    list.slice(1, 4).forEach((op, i) => { g += `<g class="part" data-part="instr">${nest(iconOf(op), 20 + i * 0, 30 + i * 46, 42, 42)}</g>`; });
    if (list.length < 1) g += socket(262, 16, 58, 52, lbl("instr"), "instr"); else if (list.length < 4) g += socket(20, 30 + (list.length - 1) * 46, 46, 42, lbl("instr"), "instr");
    g += hatch("battery", 120, 178, 48) + hatch("cpu", 174, 178, 48);
    const cm = o("comms");
    if (cm) g += `<g class="part" data-part="comms">${nest(iconOf(cm), 230, 176, 52, 52)}</g>`; else g += socket(228, 176, 56, 54, lbl("comms"), "comms");

  }
  if (M.craft === "telescope") {
    const pw = o("power");
    if (pw) g += wingPanel(pw.flags && pw.flags.big ? 34 : 50, 70, pw.flags && pw.flags.big ? 132 : 116, 120, "left");
    else g += socket(50, 80, 116, 100, lbl("power"), "power");
    g += `<rect x="180" y="44" width="76" height="170" rx="14" fill="#F4F6FF" stroke="${PAL.ink}" stroke-width="3"/>
      <path d="M180 58 L262 26 L262 60" fill="#E1E6FA" stroke="${PAL.ink}" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="218" cy="58" rx="38" ry="9" fill="#2A2470" stroke="${PAL.ink}" stroke-width="2.5"/>`;
    const list = o("instr") || [];
    if (list[0]) g += `<g class="part" data-part="instr">${nest(iconOf(list[0]), 190, 120, 56, 56)}</g>`; else g += socket(188, 116, 60, 64, lbl("instr"), "instr");
    if (list[1]) g += `<g class="part" data-part="instr">${nest(iconOf(list[1]), 290, 70, 54, 54)}</g>`;
    g += `<rect x="160" y="216" width="118" height="92" rx="12" fill="${PAL.gold}" stroke="${PAL.ink}" stroke-width="3"/>`;
    g += hatch("battery", 166, 222, 50) + hatch("cpu", 222, 222, 50) + hatch("prop", 194, 274, 32);
    g += hatch("adcs", 288, 222, 64);
    const cm = o("comms");
    if (cm) g += `<g class="part" data-part="comms">${nest(iconOf(cm), 296, 132, 64, 64)}</g>`; else g += socket(292, 134, 70, 70, lbl("comms"), "comms");
  } else if (M.craft === "cubesat") {
    const bus = o("bus");
    if (!bus) g += socket(160, 70, 100, 180, lbl("bus"), "bus");
    else {
      const U = bus.flags.U, cols = U === 12 ? 2 : (U === 6 ? 2 : 1), rows = U === 12 ? 6 : 3;
      const cw = 52, ch = U === 12 ? 36 : 56, w = cols * cw, h = rows * ch, x0 = 210 - w / 2, y0 = 160 - h / 2;
      const pw = o("power");
      if (pw && pw.flags.wings === 2) g += wingPanel(x0 - 112, y0 + 20, 96, h - 40, "left") + wingPanel(x0 + w + 16, y0 + 20, 96, h - 40, "right");
      else if (!pw) g += socket(x0 + w + 16, y0 + 20, 90, Math.max(70, h - 40), lbl("power"), "power");
      g += `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" rx="6" fill="${pw && pw.flags.wings === 0 ? PAL.panel : PAL.steel}" stroke="${PAL.ink}" stroke-width="3"/>`;
      if (pw && pw.flags.wings === 0) g += panelRect(x0 + 4, y0 + 4, w - 8, h - 8);
      for (let i = 1; i < cols; i++) g += `<line x1="${x0 + i * cw}" y1="${y0}" x2="${x0 + i * cw}" y2="${y0 + h}" stroke="${PAL.ink}" stroke-width="2"/>`;
      for (let j = 1; j < rows; j++) g += `<line x1="${x0}" y1="${y0 + j * ch}" x2="${x0 + w}" y2="${y0 + j * ch}" stroke="${PAL.ink}" stroke-width="1.5" stroke-dasharray="4 3"/>`;
      // parts inside, cell by cell
      const inside = [];
      (o("instr") || []).forEach(op => inside.push(["instr", op]));
      ["battery", "cpu", "adcs", "comms"].forEach(id => { const v = o(id); if (v) inside.push([id, v]); });
      const cells = cols * rows, s = Math.min(cw, ch) - 8;
      inside.slice(0, cells).forEach((p, k) => { const cx = x0 + (k % cols) * cw + (cw - s) / 2, cy = y0 + Math.floor(k / cols) * ch + (ch - s) / 2; g += `<g class="part" data-part="${p[0]}">${nest(iconOf(p[1]), cx, cy, s, s)}</g>`; });
      const missing = ["instr", "battery", "cpu", "adcs", "comms"].filter(id => has(id) && !(id === "instr" ? (o("instr") || []).length : o(id)));
      missing.slice(0, 3).forEach((id, k) => { g += socket(18, 20 + k * 96, 78, 84, lbl(id), id); });
    }
  } else {
    // orbiter / earth satellite
    const pw = o("power");
    const wings = pw ? (pw.flags.wings || 1) : 0, big = pw && (pw.flags.big || (pw.gen || 0) > 1100);
    const ww = big ? 124 : 108;
    if (pw) { g += wingPanel(286, 120, ww - 4, 72, "right"); if (wings > 1) g += wingPanel(134 - ww, 120, ww - 4, 72, "left"); }
    else { g += socket(290, 116, 104, 80, lbl("power"), "power"); g += socket(26, 116, 104, 80, lbl("power"), "power"); }
    g += foil(150, 96, 120, 120);
    g += hatch("battery", 160, 106, 48) + hatch("cpu", 212, 106, 48) + hatch("prop", 160, 158, 48) + hatch("adcs", 212, 158, 48);
    const cm = o("comms");
    if (cm) g += `<g class="part" data-part="comms">${nest(iconOf(cm), 172, 16, 76, 80)}</g>`; else g += socket(174, 18, 72, 70, lbl("comms"), "comms");
    g += instrRow(210 - 2 * 52 + 4, 228, 48, 4);
  }
  return `<svg class="stage-svg" viewBox="0 0 420 320" role="img" aria-label="${esc(T("Your spacecraft", "مركبتك"))}">${g}</svg>`;
}

/* ===================== SECOND CHANCE v2 — what happens in flight ===================== */
function evStorm(t, x) {
  const robust = !!x.flag("robust") || x.has("fault");
  return { t, decision: {
    id: "storm", role: "nav", label: B("Solar storm!", "عاصفة شمسية!"), expr: "worried",
    q: B("Space-weather alert! A big solar storm arrives in six hours. What do we do?", "تحذير من طقس الفضاء! عاصفة شمسية كبيرة تصل بعد ست ساعات. ماذا نفعل؟"),
    opts: [
      { t: B("Hide in safe mode", "ندخل الوضع الآمن"), good: true,
        why: B("Safe mode costs a few days of science but protects the electronics.", "الوضع الآمن يكلّف أيامًا قليلة من العلم لكنه يحمي الإلكترونيات."),
        apply: s => { s.sciMult *= 0.99; s.down += 3; s.say(B("Safe mode: three quiet days, then back to work.", "الوضع الآمن: ثلاثة أيام هادئة ثم نعود للعمل."), "good"); } },
      { t: B("Keep working", "نستمر في العمل"), good: robust,
        why: robust ? B("A backup brain and a tested self-repair system can handle radiation hits.", "العقل الاحتياطي ونظام الإصلاح الذاتي المختبَر يتحملان ضربات الإشعاع.")
                    : B("Nothing on board was built or tested to recover from radiation hits by itself.", "لا شيء على متن المركبة صُمم أو اختُبر ليتعافى من الإشعاع وحده."),
        apply: s => {
          if (robust) s.say(B("Radiation hits are caught and fixed automatically. No data lost!", "ضربات الإشعاع اكتُشفت وأُصلحت تلقائيًا. لم نفقد أي بيانات!"), "good");
          else { s.lifeMult *= 0.93; s.sciMult *= 0.95; s.down += 14; s.say(B("A radiation hit restarts the computer. Two weeks to recover.", "ضربة إشعاع أعادت تشغيل الحاسوب. أسبوعان للتعافي."), "bad"); }
        } }
    ] } };
}

      q: B("The instruments make more data than the radio can send home. The memory is full!", "الأجهزة تنتج بيانات أكثر مما يستطيع الراديو إرساله. الذاكرة ممتلئة!"),
      opts: [

          why: B("When the radio is the bottleneck, choosing what to send is a science decision.", "عندما يكون الراديو هو العائق، فاختيار ما نرسله قرار علمي."),
          apply: s => { s.dataBoost = 0.35; s.say(B("The science team picks the best targets every day.", "فريق العلوم يختار أفضل الأهداف كل يوم."), "good"); } },
        { t: B("Keep recording everything", "نستمر في تسجيل كل شيء"), good: false,

      { t: B("Keep everything running", "نُبقي كل شيء يعمل"), good: spare,
        why: spare ? B("You launched with 30%+ spare battery, so it can take the loss.", "أطلقت ببطارية فيها احتياطي 30% أو أكثر، فهي تتحمل الخسارة.") : B("Without spare battery the spacecraft runs dry in every shadow and resets.", "دون احتياطي في البطارية تنفد الطاقة في كل ظل وتعيد المركبة التشغيل."),

    ] } };
}
const shake = t => ({ t, tone: "warn", txt: B("Launch shaking loosens a connector that was never shake-tested. One instrument works less well.", "اهتزاز الإطلاق فكّ موصلًا لم يُختبر. أحد الأجهزة يعمل بكفاءة أقل."), run: s => { s.sciMult *= 0.85; } });

/* ---------- flight logic for the two new cases ---------- */
LOGIC.vanguard = {
  timeline(x) {
    const T = [];
    const highP = !!x.flag("highP"), lox = !!x.flag("loxLead"), wired = !!x.flag("wired"), ign = x.has("ignite"), leak = x.has("leak"), telem = x.has("telem");
    const inspected = !!x.flag("inspected");
    // The 1957 failure: low start pressure + rough start, and possibly a loose connection, not caught on the test stand
    const rough = !highP && !lox;
    const loose = !wired && !leak && !inspected;
    if (ign && rough) T.push({ t: 0.004, tone: "good", expr: "party", txt: B("Engine start test: a pressure spike at ignition burns the test injector! Engineers raise the tank pressure before launch. 🎉", "اختبار تشغيل المحرك: قفزة ضغط عند الإشعال أحرقت حاقن الاختبار! رفع المهندسون ضغط الخزان قبل الإطلاق. 🎉"), run: s => { s.extra.fixedStart = true; } });
    if ((leak || inspected) && !wired) T.push({ t: 0.006, tone: "good", txt: B("Inspection finds a fuel connection that isn’t fully tight. Fixed.", "الفحص وجد وصلة وقود غير محكمة تمامًا. أُصلحت.") });
    T.push({ t: 0.01, tone: "good", txt: B("6 December 1957, Cape Canaveral. Ignition!", "6 ديسمبر 1957، كيب كانافيرال. إشعال!") });
    const fails = (rough && !ign) || (loose && !highP && !ign);
    if (fails) {
      T.push({ t: 0.02, tone: "bad", expr: "shocked", txt: B("T+1 s: a pressure surge hits the engine. A fuel line bursts.", "بعد ثانية: موجة ضغط تضرب المحرك. خط وقود ينفجر.") });
      T.push({ t: 0.03, run: s => s.lose(0.03, telem
        ? B("T+2 s: thrust lost at about one metre up. The rocket falls back and explodes. Your extra sensors recorded everything: the cause is clear this time.", "بعد ثانيتين: ضاع الدفع على ارتفاع متر تقريبًا. سقط الصاروخ وانفجر. حساساتك الإضافية سجّلت كل شيء: السبب واضح هذه المرة.")
        : B("T+2 s: thrust lost at about one metre up. The rocket falls back and explodes on the pad. The satellite rolls away, still beeping.", "بعد ثانيتين: ضاع الدفع على ارتفاع متر تقريبًا. سقط الصاروخ وانفجر على المنصة، والقمر يتدحرج بعيدًا وما زال يُصدر إشارته.")) });
      return T;
    }

    story: B("Lunar Sprout is a made-up mission, but its problem is real. A day on the Moon lasts about two Earth weeks, and so does the night, when temperatures fall far below freezing. Many Moon landers have stopped working when their first lunar night arrived. Real missions survive the night with thick insulation, big batteries, tiny long-lasting heater units, or by landing on peaks near the poles that get sunlight most of the time.",

"use strict";
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function fmt(v, d) { d = d || 0; const k = Math.pow(10, d); return (Math.round(v * k) / k).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const nfmt = v => Number.isInteger(v) ? fmt(v) : fmt(v, Math.abs(v) < 1 ? 2 : 1);

function loadBest() { try { return JSON.parse(localStorage.getItem("secondChance2.best") || "{}") || {}; } catch (e) { return {}; } }
function saveBest() { try { localStorage.setItem("secondChance2.best", JSON.stringify(G.best)); } catch (e) { /* storage off */ } }

function mission(id) { return MISSIONS.find(m => m.id === (id || G.mid)); }
function stepsFor(M) { return M.open ? ["intro", "objective", "build", "launch", "tests", "poll", "flight", "closed"] : ["crash", "investigate", "objective", "build", "launch", "tests", "poll", "flight", "closed"]; }
function newDesign() { return { goal: null, extra: [], picks: {}, step: 0, maxStep: 0, votes: {}, clues: [], diag: { q: 0, tries: 0, wrong: 0, done: false }, stats: { noGo: 0, pendingFix: false, fixed: false }, launched: false, result: null, seen: {}, track: { acts: { sci: 0, eng: 0, nav: 0, pm: 0 }, hints: 0, swaps: 0, polls: [], time: {} } }; }
function design() { if (!G.designs[G.mid]) G.designs[G.mid] = newDesign(); return G.designs[G.mid]; }
function slot(M, id) { return M.slots.find(s => s.id === id); }
function optOf(M, D, sid) {
  const s = slot(M, sid); if (!s) return null;
  const v = D.picks[sid];
  if (s.multi) return (v || []).map(id => s.opts.find(o => o.id === id)).filter(Boolean);
  return s.opts.find(o => o.id === v) || null;
}

function calc(M, D) {

    c.data > 0 ? B(`Sends ${fmt(c.down, 1)}, makes ${fmt(c.data, 1)} Gb a day.`, `يرسل ${fmt(c.down, 1)} وينتج ${fmt(c.data, 1)} غيغابت يوميًا.`) : B("Very little data to send.", "بيانات قليلة جدًا."));

/* ---------- flight simulation ---------- */
let RUN = null;
function makeCtx(M, D, c) {
  return { M, D, c,
    pick: id => { const s = slot(M, id); const v = D.picks[id]; return s && s.multi ? (v || []) : v; },
    opt: id => optOf(M, D, id), has: id => (D.picks.tests || []).includes(id),
    goal: id => D.goal === id || D.extra.includes(id), flag: k => c.flags[k] };
}
function startFlight() {
  const M = mission(), D = design(), c = calc(M, D);
  const sim = { outcome: "success", lifeMult: 1, sciMult: 1, dataBoost: 0, extra: {}, log: [], decisions: [], lostAt: null, p: 0, paused: false, done: false, down: 0, series: [], marks: [], lastSample: -1,
    say(txt, tone, expr) { this.log.push({ p: this.p, txt, tone: tone || "info", expr }); if (tone === "bad" || tone === "warn" || tone === "good") this.marks.push({ p: this.p, tone }); },
    lose(t, txt) { this.outcome = "lost"; this.lostAt = t; this.say(txt, "bad", "shocked"); } };
  const x = makeCtx(M, D, c);
  const items = LOGIC[M.id].timeline(x).sort((a, b) => a.t - b.t);
  const ev = MODES[G.mode].events;
  let items2 = items.filter(it => !it.decision || !(it.decision.id === "backlog" || it.decision.id === "budget") || ev.includes("ops"));
  if (ev.includes("glitch")) items2.push(evGlitch(0.76));
  if (ev.includes("cell")) items2.push(evCell(0.5, x));
  items2.sort((a, b) => a.t - b.t);
  items.length = 0; items2.forEach(i => items.push(i));
  RUN = { mid: M.id, M, D, c, x, sim, items, idx: 0, last: 0, raf: 0, shown: 0, pending: null, stars: makeStars() };
}
function makeStars() { const a = []; let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647; for (let i = 0; i < 140; i++) a.push([rnd(), rnd(), rnd() * 1.8 + 0.4, rnd() * 6]); return a; }

function score(R) {
  const { M, D, c, sim, x } = R;
  const dataF = c.ratio < 1 ? Math.min(1, c.ratio + sim.dataBoost * (1 - c.ratio)) : 1;
  const powerF = c.gen > 0 && c.gen < c.load ? c.gen / c.load : 1;
  const battF = c.wh < c.needWh ? 0.85 : 1;
  const lifeF = Math.min(1.25, c.life * sim.lifeMult);
  const lostF = sim.outcome === "lost" ? 0 : 1;
  const achieved = c.sciPot * c.calM * dataF * powerF * battF * sim.sciMult * c.sciM * lifeF * lostF;
  const sci = Math.round(clamp(100 * achieved / M.env.refSci, 0, 100));
  let outcome = sim.outcome;
  if (outcome === "success" && (powerF < 1 || battF < 1)) outcome = "partial";
  const perf = outcome === "success" ? 100 : outcome === "rescued" ? 92 : outcome === "partial" ? Math.round(45 + 25 * Math.min(1, lifeF)) : 0;
  // launch margins (what engineers actually review)
  const cap = c.mcap != null ? c.mcap : c.cap;
  const margins = { mass: (cap - c.mass) / cap, power: c.load ? (c.gen - c.load) / c.load : 0, battery: c.needWh ? (c.wh - c.needWh) / c.needWh : 1, data: c.ratio - 1, budget: (c.budget - c.cost) / c.budget, time: (deadlineOf(M) - c.months) / deadlineOf(M) };
  const bS = c.cost <= c.budget ? 80 + Math.min(20, margins.budget * 200) : 0;
  const mS = margins.mass < 0 ? 0 : margins.mass < 0.05 ? 55 : margins.mass < 0.1 ? 75 : margins.mass <= 0.35 ? 100 : 75;
  const pS = margins.power < 0 ? 15 : margins.power < 0.1 ? 65 : margins.power <= 0.6 ? 100 : 85;
  const btS = margins.battery < 0 ? 30 : margins.battery < 0.2 ? 80 : 100;
  const dS = c.ratio < 1 ? Math.round(100 * c.ratio) : c.ratio <= 3 ? 100 : 85;
  const eff = Math.round((bS + mS + pS + btS + dS) / 5);
  // decisions
  const keys = LOGIC[M.id].keys(x, sim).concat(sim.decisions.map(d => ({ ok: d.good, pts: 8, t: B(`In flight: ${L(d.label)} You chose “${L(d.choice)}”.`, `أثناء الطيران: ${L(d.label)} اخترت «${L(d.choice)}».`), why: d.why })));
  const tot = keys.reduce((a, k) => a + k.pts, 0);
  const dec = Math.round(100 * keys.filter(k => k.ok).reduce((a, k) => a + k.pts, 0) / tot);
  const flightCalls = { good: sim.decisions.filter(d => d.good).length, total: sim.decisions.length };
  // telemetry
  const plannedDays = M.env.days;
  const daysOp = sim.outcome === "lost" ? Math.round((sim.lostAt || 0) * plannedDays) : Math.round(plannedDays * Math.min(lifeF, 1.25));
  const scienceDays = sim.outcome === "lost" ? 0 : Math.max(0, daysOp - sim.down);
  const uptime = daysOp ? Math.round(100 * scienceDays / daysOp) : 0;
  const dataGb = Math.round(c.data * scienceDays * dataF * powerF * battF * sim.sciMult * c.sciM);
  const dataPlanGb = Math.round(c.data * plannedDays);
  // teamwork, role by role
  const tr = D.track, roleRows = [];
  const voteScore = (v, worst) => v === "go" ? (worst === "nogo" ? 0 : worst === "warn" ? 70 : 100) : (worst === "nogo" ? 100 : worst === "warn" ? 85 : 40);
  const tests = D.picks.tests || [], testSlot = slot(M, "tests");
  const domain = {
    sci: clamp(sci - 10 * c.off.length + (c.goalsMet.length > 1 ? 5 : 0), 0, 100),
    eng: Math.round((mS + pS + btS) / 3),
    nav: Math.round((dS + (c.orbitOk ? 100 : 0) + (c.orbit && c.orbit.sciM ? 100 * c.orbit.sciM : 100)) / 3),
    pm: Math.round((bS + (margins.time >= 0 ? 100 : 0) + 100 * Math.min(1, tests.length / Math.max(1, testSlot ? Math.ceil(testSlot.opts.length * 0.6) : 1))) / 3)
  };
  ROLE_ORDER.forEach(r => {
    const votes = tr.polls.filter(v => v.role === r);
    const vS = votes.length ? Math.round(votes.reduce((a, v) => a + voteScore(v.v, v.worst), 0) / votes.length) : null;
    const ds = sim.decisions.filter(d => d.role === r);
    const dS2 = ds.length ? Math.round(100 * ds.filter(d => d.good).length / ds.length) : null;
    const parts = [[domain[r], 0.5], [vS, 0.25], [dS2, 0.25]].filter(p => p[0] != null);
    const w = parts.reduce((a, p) => a + p[1], 0);
    roleRows.push({ role: r, player: playerFor(r), acts: tr.acts[r] || 0, domain: domain[r], vote: vS, calls: ds.length ? `${ds.filter(d => d.good).length}/${ds.length}` : "–", score: Math.round(parts.reduce((a, p) => a + p[0] * p[1], 0) / w),
      redMissed: votes.filter(v => v.v === "go" && v.worst === "nogo").length, needless: votes.filter(v => v.v === "nogo" && v.worst === "go").length, caught: votes.filter(v => v.v === "nogo" && v.worst === "nogo").length });
  });
  let team = roleRows.reduce((a, r) => a + r.score, 0) / 4 - 15 * (D.stats.redGo || 0) + (D.stats.fixed ? 5 : 0);
  const per = {};
  if (G.crew.n > 1) {
    ROLE_ORDER.forEach(r => { const p = G.crew.owner[r]; per[p] = (per[p] || 0) + (tr.acts[r] || 0) + tr.polls.filter(v => v.role === r).length + sim.decisions.filter(d => d.role === r).length; });
    const sum = Object.values(per).reduce((a, b) => a + b, 0) || 1, n = G.crew.n, mx = Math.max.apply(null, Object.values(per)) / sum;
    const balance = n > 1 ? clamp(1 - (mx - 1 / n) / (1 - 1 / n), 0, 1) : 1;
    team = team * (0.85 + 0.15 * balance);
  }
  team = Math.round(clamp(team, 0, 100));
  const share = Object.keys(per).map(k => ({ player: pname(+k), n: per[k] }));
  // level challenges
  const base = { outcome, sci, margins, flightCalls, telemetry: { uptime } };
  const ch = CHALLENGES[G.mode].map(cc => ({ id: cc.id, t: cc.t, ok: !!cc.ok(base, c, D, M) }));
  const chDone = ch.filter(x => x.ok).length, chal = Math.round(100 * chDone / ch.length);
  const total = Math.round(0.25 * perf + 0.20 * sci + 0.20 * dec + 0.15 * eff + 0.10 * team + 0.10 * chal);
  const scoreStars = total >= 85 ? 3 : total >= 65 ? 2 : total >= 40 ? 1 : 0;
  const chStars = chDone === ch.length ? 3 : chDone / ch.length >= 0.6 ? 2 : chDone >= 1 ? 1 : 0;
  const stars = Math.min(scoreStars, chStars);
  const reqs = c.goalsMet.flatMap(gm => gm.g.req.map(r => ({ t: r.t, v: r.v, met: gm.met && outcome !== "lost" })));
  reqs.push({ t: B("Weight is within the rocket’s limit", "الوزن ضمن حد الصاروخ"), v: "Inspection", met: c.cap != null && c.mass <= c.cap });
  reqs.push({ t: B("Makes at least as much power as it uses", "ينتج طاقة لا تقل عما يستهلك"), v: "Analysis", met: c.gen >= c.load });
  reqs.push({ t: B("The radio can send all the data home", "الراديو يستطيع إرسال كل البيانات"), v: "Demonstration", met: c.ratio >= 1 });
  const series = sim.series.slice(), marks = sim.marks.slice();
  return { outcome, perf, sci, eff, dec, team, collab: team, chal, ch, total, stars, keys, reqs, k2: !!sim.extra.k2, peri: sim.extra.peri, margins, flightCalls,
    telemetry: { plannedDays, daysOp, scienceDays, uptime, dataGb, dataPlanGb, down: sim.down, dataF, ratio: c.ratio, cost: c.cost, budget: c.budget, months: c.months, deadline: deadlineOf(M), mass: c.mass, cap, tests: tests.length, testsAll: testSlot ? testSlot.opts.length : 0, hints: tr.hints, swaps: tr.swaps, wrong: D.diag.wrong },
    roles: roleRows, share, series, marks, mode: G.mode, lifeF };
}

    g.fillStyle = shade; g.beginPath(); g.arc(x + r * 0.45, y + r * 0.35, r * 1.05, 0, 7); g.fill();
    g.restore();
    g.lineWidth = Math.max(3, r * 0.06); g.strokeStyle = "#1B1650"; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke();

  power: B("We use more power than we make! Bigger solar panels?", "نستهلك طاقة أكثر مما ننتج! ألواح شمسية أكبر؟"),
  battery: B("The battery won’t last through the dark part of the orbit.", "البطارية لن تكفي خلال الجزء المظلم من المدار."),

};

function orbiReact(before, after, opt) {
  const was = {}; before.forEach(c => { was[c.key] = c.status; });
  const worse = after.find(c => (c.status === "nogo" || c.status === "warn") && was[c.key] !== c.status && REACT[c.key] && !(was[c.key] === "nogo" && c.status === "warn"));
  if (worse) { orbiSay(REACT[worse.key], worse.status === "nogo" ? "shocked" : "worried"); return; }
  const fixed = after.find(c => c.status === "go" && (was[c.key] === "nogo"));
  if (fixed) { orbiSay(B("Problem solved! 🎉", "تم حل المشكلة! 🎉"), "party"); return; }
  if (opt && Math.random() < 0.45) orbiSay(PRAISE[Math.floor(Math.random() * PRAISE.length)], "happy", { speak: G.mode === "cadet" });
}

/* ---------- mission frame ---------- */
function roleTag(role) {
  if (!role) return "";
  return `<span class="roletag" style="--rc:${ROLES[role].color}">${ROLES[role].emoji} ${L(ROLES[role].name)}${G.crew.n > 1 ? `: <b>${esc(playerFor(role))}</b>` : ""}</span>`;

function substeps(step) {
  if (!SUBSTEP[step]) return "";
  const keys = Object.keys(SUBSTEP), i = keys.indexOf(step);
  return `<ol class="subs">${keys.map((k, j) => `<li class="${j === i ? "on" : j < i ? "done" : ""}">${L(SUBSTEP[k])}</li>`).join("")}</ol>`;
}
function navRow(backOk, nextLabel, missing, act) {
  return `<div class="navrow">
    ${backOk ? `<button type="button" class="btn ghost" data-act="prev">◂ ${T("Back", "رجوع")}</button>` : "<span></span>"}
    ${missing && missing.length ? `<span class="missing">${T("Still needed", "ما زال مطلوبًا")}: ${missing.join(T(", ", "، "))}</span>` : "<span></span>"}
    <button type="button" class="big-btn sm" data-act="${act || "next"}" ${missing && missing.length ? "disabled" : ""}>${nextLabel}</button></div>`;
}
function meters(M, D, c) {
  const ck = checks(M, D, c);
  const st = k => (ck.find(x => x.key === k) || { status: "wait" }).status;
  const num = MODES[G.mode].numbers;
  const crit = k => M.critical.includes(k) ? `<span class="crit" title="${esc(L(M.criticalWhy))}">★</span>` : "";
  const m = (key, em, label, frac, val, sKey) => { const s = st(sKey || key);
    return `<div class="meter ${s}"><div class="mt"><span>${em} ${label}${crit(key)}</span>${num ? `<span class="mv">${val}</span>` : ""}</div><div class="mbar"><i style="width:${clamp(frac * 100, 3, 100)}%"></i></div></div>`; };
  let h = "";
  if (c.mcap != null) { h += m("volume", "📦", T("Space", "المساحة"), c.ucap ? c.u / c.ucap : 0.05, `${fmt(c.u, 1)}/${fmt(c.ucap, 1)} U`); h += m("mass", "⚖️", T("Weight", "الوزن"), c.mass / c.mcap, `${fmt(c.mass, 1)}/${fmt(c.mcap, 1)} ${T("kg", "كغ")}`, "busmass"); }
  else h += m("mass", "⚖️", T("Weight", "الوزن"), c.cap ? c.mass / c.cap : 0.25, c.cap ? `${fmt(c.mass)}/${fmt(c.cap)} ${T("kg", "كغ")}` : `${fmt(c.mass)} ${T("kg", "كغ")}`);
  h += m("power", "⚡", T("Power", "الطاقة"), c.gen ? c.load / c.gen : 0.2, c.gen ? `${fmt(c.load)}/${fmt(c.gen)} W` : "–");
  h += m("battery", "🔋", T("Battery", "البطارية"), c.wh ? c.needWh / c.wh : 0.2, c.wh ? `${fmt(c.needWh)}/${fmt(c.wh)} Wh` : "–");
  h += m("data", "📶", T("Data", "البيانات"), c.rate ? (c.data ? c.data / c.down : 0.05) : 0.2, c.rate ? `${fmt(c.data, 1)}/${fmt(c.down, 1)}` : "–");
  h += m("budget", "💰", T("Money", "المال"), c.cost / c.budget, `${money(M, c.cost)}/${money(M, c.budget)}`);
  h += m("schedule", "⏳", T("Time", "الوقت"), c.months / deadlineOf(M), `${fmt(c.months, 1)}/${deadlineOf(M)} ${T("mo", "شهر")}`);
  return `<div class="meters" aria-label="${esc(T("Resources", "الموارد"))}">${h}</div>`;
}
function stats(M, s, o) {
  if (!MODES[G.mode].numbers) {
    const lv = (v, max) => { const k = max ? Math.max(1, Math.round(3 * v / max)) : 0; return "●".repeat(k) + "○".repeat(3 - k); };
    const mx = f => Math.max.apply(null, s.opts.map(x => x[f] || 0));
    const out = [];
    if (o.m) out.push(`⚖️ ${lv(o.m, mx("m"))}`); if (o.p) out.push(`⚡ ${lv(o.p, mx("p"))}`); if (o.gen || o.genU) out.push(`☀️ ${lv(o.gen || o.genU, mx(o.gen ? "gen" : "genU"))}`);
    if (o.cost) out.push(`💰 ${lv(o.cost, mx("cost"))}`); if (o.sci) out.push(`🔬 ${lv(o.sci, mx("sci"))}`); if (o.rate) out.push(`📶 ${lv(o.rate, mx("rate"))}`);
    return out.map(x => `<span>${x}</span>`).join("");
  }
  const ch = [];
  if (o.m) ch.push(`⚖️ ${nfmt(o.m)} ${T("kg", "كغ")}`); if (o.u) ch.push(`📦 ${nfmt(o.u)} U`); if (o.p) ch.push(`⚡ ${nfmt(o.p)} W`);
  if (o.gen) ch.push(`☀️ +${fmt(o.gen * M.env.solar)} W`); if (o.genU) ch.push(`☀️ +${nfmt(o.genU)} W/U`); if (o.wh) ch.push(`🔋 ${o.wh} Wh`);
  if (o.cap) ch.push(`🚀 ${nfmt(o.cap)} ${T("kg", "كغ")}`); if (o.cost != null) ch.push(`💰 ${money(M, o.cost)}`); if (o.mo) ch.push(`⏳ +${nfmt(o.mo)} ${T("mo", "شهر")}`);
  if (o.data) ch.push(`💾 ${nfmt(o.data)} Gb`); if (o.rate) ch.push(`📶 ${nfmt(o.rate)} Gb`); if (o.sci) ch.push(`🔬 ${o.sci}`);
  return ch.map(x => `<span>${x}</span>`).join("");
}

/* Chapter 2: the investigation board */
function vInvestigate(M, D) {
  const st = M.story, opened = D.clues.length, all = opened >= st.clues.length;
  const cards = st.clues.map((cl, i) => { const open = D.clues.includes(i);
    return `<button type="button" class="clue ${open ? "open" : ""}" data-act="clue" data-i="${i}" style="--r:${[-3, 2, -1.5, 3, -2][i % 5]}deg" aria-expanded="${open}">
      <span class="tape" aria-hidden="true"></span>
      <span class="clue-front"><span class="clue-ic">${icon(cl.ic)}</span><span class="clue-n">${T("Clue", "دليل")} ${i + 1}</span><span class="clue-t">${L(cl.t)}</span><span class="tap">${T("Tap to open", "اضغط للفتح")}</span></span>
      <span class="clue-back"><span class="clue-t">${L(cl.t)}</span><span class="clue-body">${esc(L(cl.body)).replace(/\n/g, "<br>")}</span></span>
    </button>`; }).join("");
  let solve = "";
  if (all && !D.diag.done) {
    const q = st.diagnose[D.diag.q];
    solve = `<div class="solve" id="solve"><h2>🔍 ${L(q.q)}</h2><div class="answers">${q.opts.map((o, i) => `<button type="button" class="answer" data-act="answer" data-i="${i}">${L(o.t)}</button>`).join("")}</div></div>`;
  } else if (D.diag.done) {
    solve = `<div class="solved"><div class="badge-big">${badgeSVG(M.badge.color, M.badge.glyph)}</div><div><p class="kicker">${T("Case cracked! Badge earned", "تم حل القضية! حصلت على شارة")}</p><h2>${L(M.badge.name)}</h2>
      <p>${T("Now you know what went wrong. Time to redesign the mission so it can’t happen again.", "الآن تعرف ما الخطأ. حان وقت إعادة تصميم المهمة حتى لا يتكرر.")}</p>
      <button type="button" class="big-btn sm" data-act="next">${T("Redesign the mission", "أعد تصميم المهمة")} 🛠️</button></div></div>`;
  }
  return `<div class="scene-head"><h1>${T("The investigation", "التحقيق")}</h1><span class="counter">${T("Clues opened", "الأدلة المفتوحة")}: ${opened}/${st.clues.length}</span></div>
    <div class="board">${cards}</div>${solve}`;
}

/* Chapter 3: redesign */
function vObjective(M, D, c) {
  c = c || calc(M, D);
  const { prim, sec } = goalList(M);
  const primCards = prim.map(g => `<button type="button" class="goal ${D.goal === g.id ? "on" : ""}" data-act="goal" data-id="${g.id}" aria-pressed="${D.goal === g.id}"><span class="gem" aria-hidden="true">${goalEmoji(g)}</span><b>${L(g.n)}</b><span>${L(g.d)}</span></button>`).join("");
  const secCards = sec.filter(g => g.id !== D.goal).map(g => { const on = D.extra.includes(g.id);
    return `<button type="button" class="goal small ${on ? "on" : ""}" data-act="extra" data-id="${g.id}" aria-pressed="${on}"><span class="gem" aria-hidden="true">${goalEmoji(g)}</span><b>${L(g.n)}</b><span>${L(g.d)}</span></button>`; }).join("");
  const goals = selectedGoals(M, D);
  const reqs = goals.flatMap(g => g.req.map(r => `<li><span class="vb">${L(VERIFY[r.v])}</span>${L(r.t)}</li>`));
  return `<div class="scene-head"><h1>${T("What should the mission answer?", "ما السؤال الذي ستجيب عنه المهمة؟")}</h1>${roleTag("sci")}</div>${substeps("objective")}
    <h2 class="sec">${T("Main question", "السؤال الرئيسي")}</h2><div class="goals">${primCards}</div>
    <h2 class="sec">${T("Bonus goals", "أهداف إضافية")} <span class="muted small">${T("(optional: more science, harder design)", "(اختياري: علم أكثر، وتصميم أصعب)")}</span></h2><div class="goals">${secCards}</div>
    ${goals.length ? `<div class="rules"><h3>📜 ${T("Mission rules (requirements)", "قواعد المهمة (المتطلبات)")}</h3><p class="small muted">${T("Every goal becomes a rule, and every rule needs a way to prove it.", "كل هدف يصبح قاعدة، وكل قاعدة تحتاج طريقة لإثباتها.")}</p><ul>${reqs.join("")}</ul></div>` : ""}
    ${challengeCard()}
    ${navRow(false, `${T("Build the spacecraft", "ابنِ المركبة")} 🛠️`, D.goal ? [] : [T("a main question", "سؤال رئيسي")])}`;
}

function vBuild(M, D) {
  const c = calc(M, D);
  const list = M.slots.filter(s => s.phase === "craft");
  if (!D.tab || !list.find(s => s.id === D.tab)) D.tab = list[0].id;
  const tabs = list.map(s => { const v = D.picks[s.id]; const done = s.multi ? (v || []).length : !!v;
    return `<button type="button" role="tab" class="tab ${D.tab === s.id ? "on" : ""} ${done ? "done" : ""}" data-act="tab" data-id="${s.id}" aria-selected="${D.tab === s.id}"><span aria-hidden="true">${s.tab}</span> ${L(s.short || s.label)}${done ? " ✓" : ""}</button>`; }).join("");
  const s = slot(M, D.tab);
  const parts = s.opts.map(o => { const sel = s.multi ? (D.picks[s.id] || []).includes(o.id) : D.picks[s.id] === o.id;
    return `<div class="part-card ${sel ? "on" : ""}" data-drag="1" data-slot="${s.id}" data-opt="${o.id}">
      <div class="pic" aria-hidden="true">${icon(o.ic, o.icp)}</div>
      <div class="pinfo"><b>${L(o.n)}</b><div class="pstats">${stats(M, s, o)}</div><p>${L(o.d)}</p>${o.tags ? `<div class="ptags">${o.tags.map(t => TAGEMO[t] + " " + L(TAGNAME[t])).join(" · ")}</div>` : ""}${o.hist && !M.open ? `<span class="hist">${T("Flown in the real mission", "استُخدم في المهمة الحقيقية")}</span>` : ""}</div>
      <button type="button" class="add ${sel ? "on" : ""}" data-act="place" data-slot="${s.id}" data-opt="${o.id}" aria-pressed="${sel}">${sel ? (s.multi ? T("Remove", "إزالة") : "✓ " + T("Installed", "مُركّب")) : T("Install", "ركّب")}</button>
    </div>`; }).join("");
  const missing = list.filter(sl => sl.multi ? !(D.picks[sl.id] || []).length : !D.picks[sl.id]).map(sl => L(sl.short || sl.label));
  return `<div class="scene-head"><h1>${T("Build your spacecraft", "ابنِ مركبتك")}</h1>${roleTag("eng")}</div>${substeps("build")}
    <div class="build">
      <div class="stage" id="stage"><div class="stage-tip">${T("Drag parts here, or tap Install", "اسحب القطع إلى هنا، أو اضغط «ركّب»")}</div>${stageSVG(M, D, c)}${meters(M, D, c)}</div>
      <div class="tray"><div class="tabs" role="tablist">${tabs}</div>
        <div class="slot-info"><b>${L(s.label)}</b> ${roleTag(s.role)}${s.hint ? `<p class="small">${L(s.hint)}</p>` : ""}</div>
        <div class="parts">${parts}</div></div>
    </div>
    ${navRow(true, `${T("To the launch pad", "إلى منصة الإطلاق")} 🚀`, missing)}`;
}

function choiceCards(M, D, s, c, art) {
  return s.opts.map(o => { const sel = D.picks[s.id] === o.id;
    let extra = "";
    if (s.kind === "launcher") {
      const fits = c.mass <= o.cap, reach = !c.orbit || !o.orbits || o.orbits.includes(c.orbit.id);
      extra = `<div class="capbar"><i style="width:${clamp(c.mass / o.cap * 100, 2, 100)}%" class="${fits ? "" : "over"}"></i></div><div class="small ${fits && reach ? "ok" : "bad"}">${!fits ? T("Too heavy for this rocket", "ثقيل جدًا على هذا الصاروخ") : !reach ? T("Can’t reach your orbit", "لا يصل إلى مدارك") : T("Fits!", "مناسب!")}</div>`;
    }
    return `<button type="button" class="choice ${sel ? "on" : ""}" data-act="place" data-slot="${s.id}" data-opt="${o.id}" aria-pressed="${sel}">
      <span class="cart" aria-hidden="true">${art(o)}</span><b>${L(o.n)}</b><span class="pstats">${stats(M, s, o)}</span><span class="cd">${L(o.d)}</span>${extra}
      ${o.hist && !M.open ? `<span class="hist">${T("Flown in the real mission", "استُخدم في المهمة الحقيقية")}</span>` : ""}</button>`; }).join("");
}
function vLaunch(M, D) {
  const c = calc(M, D);
  const list = M.slots.filter(s => s.phase === "launch");
  const art = s => o => s.kind === "launcher" ? (o.ic === "iss" ? issSVG() : rocketSVG(o.ic, clamp(o.cap / (M.env.mass ? 30 : 1500), 0.25, 1))) : s.kind === "orbit" ? orbitSVG(o.ic) : icon(o.ic);
  const html = list.map(s => `<section class="pick"><div class="pick-h"><h2 class="sec">${L(s.label)}</h2>${roleTag(s.role)}</div>${s.hint ? `<p class="small muted">${L(s.hint)}</p>` : ""}<div class="choices">${choiceCards(M, D, s, c, art(s))}</div></section>`).join("");
  const missing = list.filter(s => !D.picks[s.id]).map(s => L(s.label));
  return `<div class="scene-head"><h1>${T("Launch & orbit", "الإطلاق والمدار")}</h1>${roleTag("nav")}</div>${substeps("launch")}
    ${meters(M, D, c)}${html}${navRow(true, `${T("To the test lab", "إلى مختبر الاختبارات")} 🧪`, missing)}`;
}
function vTests(M, D) {
  const c = calc(M, D);
  const list = M.slots.filter(s => s.phase === "verify");

    const cards = s.multi ? s.opts.map(o => { const on = (D.picks[s.id] || []).includes(o.id);
      return `<button type="button" class="choice test ${on ? "on" : ""}" data-act="place" data-slot="${s.id}" data-opt="${o.id}" aria-pressed="${on}"><span class="cart" aria-hidden="true">${icon(o.ic)}</span><b>${L(o.n)}</b><span class="pstats">${stats(M, s, o)}</span><span class="cd">${L(o.d)}</span><span class="tick">${on ? "✓ " + T("In the plan", "ضمن الخطة") : "+ " + T("Add test", "أضف الاختبار")}</span></button>`; }).join("")
      : choiceCards(M, D, s, c, o => icon(o.ic));
    return `<section class="pick"><div class="pick-h"><h2 class="sec">${L(s.label)}</h2>${roleTag(s.role)}</div>${s.hint ? `<p class="small muted">${L(s.hint)}</p>` : ""}<div class="choices">${cards}</div></section>`; }).join("");
  const missing = list.filter(s => !s.multi && !D.picks[s.id]).map(s => L(s.label));
  return `<div class="scene-head"><h1>${T("The test lab", "مختبر الاختبارات")}</h1>${roleTag("pm")}</div>${substeps("tests")}

}

function vPoll(M, D) {
  const c = calc(M, D), ck = checks(M, D, c);
  const idx = ROLE_ORDER.findIndex(r => !D.votes[r]);
  const chips = ROLE_ORDER.map(r => `<div class="vchip ${D.votes[r] || ""}" style="--rc:${ROLES[r].color}"><span>${ROLES[r].emoji}</span><b>${L(ROLES[r].name)}</b><i>${D.votes[r] === "go" ? "GO" : D.votes[r] === "nogo" ? "NO-GO" : "…"}</i></div>`).join("");
  let body = "";
  if (idx >= 0) {
    const r = ROLE_ORDER[idx], mine = ck.filter(x => x.role === r), hard = mine.find(x => x.hard && (x.status === "nogo" || x.status === "wait"));
    body = `<div class="pollcard" style="--rc:${ROLES[r].color}"><div class="pc-head"><span class="pe">${ROLES[r].emoji}</span><div><h2>${L(ROLES[r].name)}${G.crew.n > 1 ? `: ${esc(playerFor(r))}` : ""}</h2><p>${T("Check your numbers. Are you GO for launch?", "راجع أرقامك. هل أنت جاهز للإطلاق؟")}</p></div></div>
      <ul class="checks">${mine.map(x => `<li class="${x.status}"><span class="dot"></span><span><b>${L(x.label)}</b><span>${L(x.why)}</span></span></li>`).join("")}</ul>
      <div class="vote-row"><button type="button" class="vote go" data-act="vote" data-v="go" ${hard ? "disabled" : ""}>GO 👍</button><button type="button" class="vote nogo" data-act="vote" data-v="nogo">NO-GO ✋</button></div>
      ${hard ? `<p class="small bad">${T("You can’t be GO", "لا يمكنك قول GO")}: ${L(hard.why)}</p>` : ""}</div>`;
  } else {
    const anyNo = ROLE_ORDER.some(r => D.votes[r] === "nogo");
    const reds = ck.filter(x => x.status === "nogo" && !x.hard).length;
    body = anyNo ? `<div class="verdict nogo"><h2>✋ ${T("Launch held!", "تم إيقاف الإطلاق!")}</h2><p>${T("Someone said NO-GO. Holding a launch for a real problem is great engineering. Go fix it!", "أحدكم قال NO-GO. إيقاف الإطلاق بسبب مشكلة حقيقية هندسة رائعة. هيا أصلحوها!")}</p><button type="button" class="big-btn sm" data-act="fix">${T("Back to the design", "عودة للتصميم")} 🛠️</button></div>`
      : `<div class="verdict go"><h2>👍 ${T("All GO!", "الجميع جاهز!")}</h2><p>${reds ? T(`Careful: you’re launching with ${reds} red flag(s).`, `انتبه: ستطلق مع ${reds} علامة حمراء.`) : T("Clean board. The rocket is ready.", "كل شيء أخضر. الصاروخ جاهز.")}</p><button type="button" class="big-btn launch" data-act="launch">${T("LAUNCH", "إطلاق")} 🚀</button></div>`;
  }
  return `<div class="scene-head"><h1>${T("Go / No-Go poll", "تصويت الجاهزية")}</h1></div>${substeps("poll")}<div class="vchips">${chips}</div>${body}
    <div class="navrow"><button type="button" class="btn ghost" data-act="prev">◂ ${T("Back", "رجوع")}</button><span></span><span></span></div>`;
}

/* Chapter 4: flight */
function vFlight(M) {

    <div class="flight"><div class="cine"><canvas id="sky" width="1280" height="720" aria-label="${esc(T("Your mission flying", "مهمتك تطير"))}"></canvas><div id="decision" class="decision-wrap" aria-live="polite"></div></div>
