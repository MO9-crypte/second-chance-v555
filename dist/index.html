}

/* Chapter 5: case closed */
function yourChoice(M, D, key) {
  const has = t => (D.picks.tests || []).includes(t);
  const name = id => { const o = optOf(M, D, id); return o ? (Array.isArray(o) ? o.map(x => L(x.n)).join(T(", ", "، ")) : L(o.n)) : "–"; };
  if (key === "iface") return has("iface") ? T("Tested: mix-up found and fixed", "اختُبر: الخطأ اكتُشف وأُصلح") : T("Not tested", "لم يُختبر");
  if (key === "audit") return has("audit") ? T("Re-tested the metal", "أُعيد اختبار المعدن") : T("Trusted the certificates", "الثقة في الشهادات");
  if (key === "k2") return D.result && D.result.k2 ? T("K2: balanced on sunlight", "K2: التوازن على ضوء الشمس") : T("Not needed, or not chosen", "لم يكن ضروريًا أو لم يُختر");
  if (key === "adcs") return name("adcs") + (has("wheel") ? T(" + long test", " + اختبار طويل") : "");
  return name(key);
}

/* ---------- overlays: hand-off between players, countdown ---------- */
function handoff(role, cb) {
  if (G.crew.n < 2) { cb(); return; }
  $over.innerHTML = `<div class="handoff" role="dialog" aria-modal="true" style="--rc:${ROLES[role].color}"><div class="ho-em">${ROLES[role].emoji}</div>
    <p>${T("Pass the device to", "مرّر الجهاز إلى")}</p><h2>${esc(playerFor(role))}</h2><p class="ho-role">${L(ROLES[role].name)}</p><p class="small">${L(ROLES[role].blurb)}</p>
    <button type="button" class="big-btn sm" id="ho-go">${T("I’m ready!", "أنا جاهز!")}</button></div>`;
  $over.hidden = false;
  const b = document.getElementById("ho-go"); b.focus();
  b.onclick = () => { $over.hidden = true; $over.innerHTML = ""; cb(); };
}
function countdown(cb) {
  $over.innerHTML = `<div class="count" aria-live="assertive"><span id="cnum">3</span></div>`; $over.hidden = false;
  let n = 3; orbiSay(B("Three… two… one…", "ثلاثة… اثنان… واحد…"), "happy");
  const tick = () => { n--; const el = document.getElementById("cnum"); if (n > 0) { el.textContent = n; setTimeout(tick, 650); } else { el.textContent = T("LIFTOFF!", "انطلاق!"); setTimeout(() => { $over.hidden = true; $over.innerHTML = ""; cb(); }, 650); } };
  setTimeout(tick, 650);
}

/* ---------- step entry: Orbi lines and hand-offs ---------- */
function enterStep() {
  const M = mission(), D = design(), step = curStep();
  stopAnim();
  const role = STEP_ROLE[step];
  const prevRole = D.lastRole;
  const go = () => {
    D.lastRole = role || D.lastRole;
    render();
    const auto = MODES[G.mode].hints === "auto";
    if (step === "crash") playCrash();
    else if (step === "intro") orbiStory(M.story.intro.map(t => ({ t, e: "happy" })));
    else if (step === "investigate") { if (!D.diag.done) orbiSay(B("Let’s be detectives! Open every clue and look closely.", "هيا نكون محققين! افتح كل دليل وانظر جيدًا."), "think"); }
    else if (step === "objective") orbiSay(auto ? M.hints.objective : B("Every NASA mission starts with a question. Pick ours!", "كل مهمة لناسا تبدأ بسؤال. اختر سؤالنا!"), "happy");
    else if (step === "build") orbiSay(auto ? M.hints.build : B("Time to build! Drag parts onto the spacecraft and watch the meters.", "وقت البناء! اسحب القطع إلى المركبة وراقب العدّادات."), "happy");
    else if (step === "launch") orbiSay(auto ? M.hints.launch : B("Now pick the orbit and a rocket that can carry our weight there.", "الآن اختر المدار وصاروخًا يستطيع حمل وزننا إليه."), "happy");
    else if (step === "tests") orbiSay(auto ? M.hints.tests : B("Tests cost money and time. Which ones protect us most?", "الاختبارات تكلف مالًا ووقتًا. أيها يحمينا أكثر؟"), "think");
    else if (step === "poll") orbiSay(B("Flight Director here! Each role checks their numbers and votes GO or NO-GO.", "هنا مدير الطيران! كل دور يراجع أرقامه ويصوّت GO أو NO-GO."), "normal");
    else if (step === "flight") startFlightView();
    else if (step === "closed") { const r = D.result; orbiSay(r.outcome === "lost" ? B("We lost it… but now we know why. Want to try again?", "فقدناها… لكننا الآن نعرف السبب. نحاول مجددًا؟") : r.stars === 3 ? B("Three stars! You’re a real mission engineer! 🎉", "ثلاث نجوم! أنت مهندس مهمات حقيقي! 🎉") : B("We made it! Can you get more stars?", "نجحنا! هل تستطيع جمع نجوم أكثر؟"), r.outcome === "lost" ? "worried" : "party"); }
  };
  if (role && role !== prevRole && G.crew.n > 1) handoff(role, go); else go();
}
function goStep(i) { const D = design(); D.step = i; D.maxStep = Math.max(D.maxStep, i); window.scrollTo(0, 0); enterStep(); }

/* ---------- animations ---------- */
function stopAnim() { if (ANIM.raf) cancelAnimationFrame(ANIM.raf); ANIM.raf = 0; if (RUN && RUN.raf) { cancelAnimationFrame(RUN.raf); RUN.raf = 0; } }
function playCrash() {
  const M = mission(), cv = document.getElementById("cine"); if (!cv) return;
  const g = cv.getContext("2d"), stars = makeStars(); const dur = 11000; ANIM.t0 = performance.now(); let said = -1;
  const lines = M.story.crash;
  const loop = now => {
    const p = clamp((now - ANIM.t0) / dur, 0, 1), k = Math.min(lines.length - 1, Math.floor(p * lines.length * 1.05));
    if (k !== said) { said = k; orbiSay(lines[k], k === lines.length - 1 ? "shocked" : k === 0 ? "normal" : "worried"); }
    drawCrash(g, cv.width, cv.height, M, p, stars, now / 1000);
    if (document.getElementById("cine")) ANIM.raf = requestAnimationFrame(loop);
  };
  ANIM.raf = requestAnimationFrame(loop);
}
function startFlightView() {
  if (!RUN || RUN.mid !== G.mid) return;
  RUN.shown = 0; RUN.last = 0; RUN.lastSaid = -1;
  updateLog();
  if (RUN.sim.done) showDone(); else RUN.raf = requestAnimationFrame(tick);
  if (RUN.pending) showDecision();
}
function tick(now) {
  const R = RUN; if (!R) return;
  if (!R.last) R.last = now;
  const dt = Math.min(0.1, (now - R.last) / 1000); R.last = now;
  const s = R.sim;
  if (!s.paused && !s.done) {
    s.p = Math.min(1, s.p + dt * G.speed / 26);
    while (R.idx < R.items.length && R.items[R.idx].t <= s.p) {
      if (s.outcome === "lost") { R.idx = R.items.length; break; }
      const it = R.items[R.idx++];
      if (it.decision) { s.paused = true; R.pending = it.decision; showDecision(); break; }
      const txt = typeof it.txt === "function" ? it.txt(s) : it.txt;
      if (txt) s.say(txt, it.tone, it.expr);
      if (it.run) it.run(s);
    }
    if (s.p - s.lastSample >= 0.01) { s.lastSample = s.p; s.series.push({ p: s.p, rate: s.outcome === "lost" ? 0 : s.sciMult, life: s.lifeMult }); }
    if (s.outcome === "lost" && s.p >= s.lostAt + 0.06) finishFlight();
    else if (s.p >= 1 && R.idx >= R.items.length && !s.paused) finishFlight();
  }
  const cv = document.getElementById("sky"); if (!cv) return;
  drawFlight(cv.getContext("2d"), cv.width, cv.height, R, now / 1000);
  updateLog();
  if (!s.done) R.raf = requestAnimationFrame(tick);
}
function updateLog() {
  const R = RUN, el = document.getElementById("log"); if (!el) return;
  while (R.shown < R.sim.log.length) {
    const e = R.sim.log[R.shown++];
    const li = document.createElement("li"); li.className = e.tone;
    li.innerHTML = `<span class="t">${T("Day", "اليوم")} ${Math.round(e.p * R.M.env.days)}</span>${esc(L(e.txt))}`;
    el.appendChild(li); el.scrollTop = el.scrollHeight;
    if (!R.pending && R.shown - 1 > (R.lastSaid == null ? -1 : R.lastSaid)) { R.lastSaid = R.shown - 1; orbiSay(e.txt, e.expr || ({ good: "happy", warn: "worried", bad: "shocked" }[e.tone] || "normal"), { speak: G.speed <= 2 }); }
  }
  const ck = document.getElementById("clock"); if (ck) ck.textContent = `${T("Mission day", "يوم المهمة")} ${Math.round(R.sim.p * R.M.env.days)}`;
}
function showDecision() {
  const R = RUN, d = R.pending, box = document.getElementById("decision"); if (!box) return;
  if (!d) { box.innerHTML = ""; return; }
  orbiSay(d.q, d.expr || "worried");
  box.innerHTML = `<div class="decision"><div class="dlabel">${L(d.label)} · ${ROLES[d.role].emoji} ${L(ROLES[d.role].name)}${G.crew.n > 1 ? `: ${esc(playerFor(d.role))}` : ""}</div><p>${L(d.q)}</p>
    <div class="dopts">${d.opts.map((o, i) => `<button type="button" class="big-btn sm alt" data-act="decide" data-i="${i}">${L(o.t)}</button>`).join("")}</div></div>`;
  const b = box.querySelector("button"); if (b) b.focus({ preventScroll: true });
}
function decide(i) {
  const R = RUN; if (!R || !R.pending) return;
  const d = R.pending, o = d.opts[i];
  R.sim.decisions.push({ label: d.label, choice: o.t, good: o.good, why: o.why, role: d.role });
  R.pending = null; o.apply(R.sim); R.sim.paused = false; R.last = 0;
  showDecision();
  if (!R.raf) R.raf = requestAnimationFrame(tick);
}
function finishFlight() {
  const R = RUN, s = R.sim; if (s.done) return;
  s.done = true;
  const res = score(R); R.D.result = res;
  const list = (G.attempts[R.M.id] = G.attempts[R.M.id] || []);
  list.push({ n: list.length + 1, outcome: res.outcome, total: res.total, stars: res.stars, mode: G.mode, perf: res.perf, sci: res.sci, dec: res.dec, eff: res.eff, team: res.team, chal: res.chal });
  const prev = G.best[R.M.id] || { total: -1, stars: 0, badge: false };
  G.best[R.M.id] = { total: Math.max(prev.total, res.total), stars: Math.max(prev.stars, res.stars), badge: prev.badge || R.D.diag.done };
  saveBest();
  showDone();
}
function showDone() {
  const el = document.getElementById("done-slot");
  if (el) { el.innerHTML = `<button type="button" class="big-btn sm" data-act="next">${T("Close the case", "أغلق القضية")} ⭐</button>`; }
}

/* ---------- actions ---------- */
function pickPart(sid, oid) {
  const M = mission(), D = design(), s = slot(M, sid);
  const before = checks(M, D, calc(M, D));
  D.track.swaps++; D.track.acts[s.role] = (D.track.acts[s.role] || 0) + 1;
  if (s.multi) { const cur = D.picks[sid] || []; D.picks[sid] = cur.includes(oid) ? cur.filter(x => x !== oid) : cur.concat(oid); }
  else D.picks[sid] = oid;
  // after installing, move to the next empty tab in the build screen
  if (curStep() === "build" && !s.multi) { const list = M.slots.filter(x => x.phase === "craft"); const nx = list.find(x => x.multi ? !(D.picks[x.id] || []).length : !D.picks[x.id]); if (nx) D.tab = nx.id; }
  render();
  orbiReact(before, checks(M, D, calc(M, D)), true);
  const st = document.getElementById("stage"); if (st) { st.classList.remove("pop"); void st.offsetWidth; st.classList.add("pop"); }
}
function act(a, el) {
  const M = G.mid ? mission() : null;
  switch (a) {
    case "home": stopAnim(); hush(); G.screen = "title"; render(); orbiSay(B("Welcome back, engineer!", "مرحبًا بعودتك أيها المهندس!"), "happy", { speak: false }); break;
    case "cases": stopAnim(); G.screen = "cases"; render(); orbiSay(B("Pick a case. I’ll be right here with you!", "اختر قضية. سأكون معك هنا!"), "happy"); break;
    case "start": G.screen = "cases"; render(); orbiSay(B("Each folder is a real mission. Pick one and let’s find out what happened!", "كل ملف مهمة حقيقية. اختر واحدًا ولنكتشف ما حدث!"), "happy"); break;
    case "lang": LANG = G.lang = G.lang === "en" ? "ar" : "en"; document.documentElement.lang = LANG; document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr"; hush(); render(); orbiSay(B("Language changed!", "تم تغيير اللغة!"), "happy"); break;
    case "sound": G.sound = !G.sound; if (!G.sound) hush(); render(); if (G.sound) orbiSay(B("I can talk again!", "أستطيع الكلام مجددًا!"), "happy"); break;
    case "mode": G.mode = el.dataset.m; render(); orbiSay(MODES[G.mode].blurb, "happy"); break;
    case "crew": G.crew.n = +el.dataset.n; ROLE_ORDER.forEach((r, i) => { G.crew.owner[r] = i % G.crew.n; }); render(); break;
    case "open": { stopAnim(); hush(); G.mid = el.dataset.id; G.screen = "mission"; const D = design();
      if (D.launched && !D.result) { D.launched = false; D.votes = {}; D.step = stepsFor(mission()).indexOf("poll"); }
      if (D.result) D.step = stepsFor(mission()).indexOf("closed");
      D.lastRole = null; window.scrollTo(0, 0); enterStep(); break; }
    case "next": { const D = design(), step = curStep(), steps = stepsFor(M);
      if (step === "objective" && !D.goal) return;
      if (step === "build" && M.slots.filter(s => s.phase === "craft").some(s => s.multi ? !(D.picks[s.id] || []).length : !D.picks[s.id])) return;
      if (step === "launch" && M.slots.filter(s => s.phase === "launch").some(s => !D.picks[s.id])) return;
      if (step === "flight") { D.maxStep = steps.length - 1; }
      goStep(D.step + 1); break; }
    case "to-poll": { const D = design(); if (M.slots.filter(s => s.phase === "verify" && !s.multi).some(s => !D.picks[s.id])) return; D.votes = {}; goStep(D.step + 1); break; }
    case "prev": { const D = design(); if (D.step > 0) goStep(D.step - 1); break; }
    case "orbi-toggle": ORBI.hidden = !ORBI.hidden; orbiRender(); document.getElementById("orbi-text").textContent = ORBI.full; break;
    case "orbi-next": orbiNext(); break;
    case "orbi-repeat": orbiSay(ORBI.full, ORBI.expr, { keepQueue: true }); break;
    case "hint": design().track.hints++; orbiHint(); break;
    case "clue": { const D = design(), i = +el.dataset.i; if (!D.clues.includes(i)) D.clues.push(i); const cl = M.story.clues[i]; render(); orbiSay(cl.orbi, cl.expr);
      if (D.clues.length === M.story.clues.length && !D.diag.done) setTimeout(() => { const s = document.getElementById("solve"); if (s) s.scrollIntoView({ behavior: "smooth", block: "center" }); }, 300); break; }
    case "answer": { const D = design(), q = M.story.diagnose[D.diag.q], i = +el.dataset.i;
      if (i === q.correct) { orbiSay(q.yes, "party"); D.diag.q++; if (D.diag.q >= M.story.diagnose.length) D.diag.done = true; render(); }
      else { D.diag.wrong++; el.classList.add("shake"); el.disabled = true;
        orbiSay(MODES[G.mode].hints === "none" ? B("Not quite. Look at the clues again.", "ليس تمامًا. انظر إلى الأدلة مجددًا.") : q.opts[i].no, "worried"); }
      break; }
    case "goal": { const D = design(); D.track.acts.sci++; D.goal = el.dataset.id; D.extra = D.extra.filter(x => x !== D.goal); render(); const g = M.goals.primary.find(x => x.id === D.goal); orbiSay(B(`Great question! Now every part we pick must help answer it.`, `سؤال رائع! الآن كل قطعة نختارها يجب أن تساعد في الإجابة عنه.`), "happy", { speak: G.mode === "cadet" }); break; }
    case "extra": { const D = design(), id = el.dataset.id; D.track.acts.sci++; D.extra = D.extra.includes(id) ? D.extra.filter(x => x !== id) : D.extra.concat(id); render(); break; }
    case "tab": design().tab = el.dataset.id; render(); break;
    case "place": pickPart(el.dataset.slot, el.dataset.opt); break;
    case "vote": { const D = design(); const r = ROLE_ORDER.find(x => !D.votes[x]); if (!r) return; D.votes[r] = el.dataset.v;
      { const mine = checks(M, D, calc(M, D)).filter(k => k.role === r); const worst = mine.some(k => k.status === "nogo" || k.status === "wait") ? "nogo" : mine.some(k => k.status === "warn") ? "warn" : "go"; D.track.polls.push({ role: r, v: el.dataset.v, worst }); }
      const nx = ROLE_ORDER.find(x => !D.votes[x]);
      if (nx) { const go = () => { render(); orbiSay(B(`${L(ROLES[nx].name)}, are you GO?`, `${L(ROLES[nx].name)}، هل أنت جاهز؟`), "normal"); }; if (G.crew.n > 1 && G.crew.owner[nx] !== G.crew.owner[r]) handoff(nx, go); else go(); }
      else { render(); orbiSay(ROLE_ORDER.some(x => D.votes[x] === "nogo") ? B("Launch held. Good call if something’s wrong!", "تم إيقاف الإطلاق. قرار جيد إن كان هناك خطأ!") : B("Everyone is GO! Press LAUNCH!", "الجميع جاهز! اضغط إطلاق!"), "happy"); }
      break; }
    case "fix": { const D = design(); D.stats.noGo++; D.stats.pendingFix = true; D.votes = {}; goStep(stepsFor(M).indexOf("build")); break; }
    case "launch": { const D = design(), c = calc(M, D), ck = checks(M, D, c);
      if (ck.some(x => x.hard && (x.status === "nogo" || x.status === "wait"))) return;
      D.stats.redGo = ck.filter(x => x.status === "nogo").length; D.stats.amberGo = ck.filter(x => x.status === "warn").length;
      if (D.stats.pendingFix) { D.stats.fixed = true; D.stats.pendingFix = false; }
      D.launched = true; D.result = null; startFlight();
      countdown(() => goStep(stepsFor(M).indexOf("flight"))); break; }
    case "speed": G.speed = +el.dataset.v; document.querySelectorAll('[data-act="speed"]').forEach(b => b.classList.toggle("on", +b.dataset.v === G.speed)); break;
    case "skip": G.speed = 10; document.querySelectorAll('[data-act="speed"]').forEach(b => b.classList.remove("on")); break;
    case "decide": decide(+el.dataset.i); break;
    case "retry": { stopAnim(); RUN = null; const D = design(); D.launched = false; D.result = null; D.votes = {}; D.lastRole = null; goStep(stepsFor(M).indexOf("objective")); break; }
  }
}

/* ---------- drag & drop (mouse/pen); taps use the Install button ---------- */
let DRAG = null;
document.addEventListener("pointerdown", e => {
  const card = e.target.closest("[data-drag]");
  if (!card || e.pointerType === "touch" || e.button > 0 || e.target.closest("button")) return;
  DRAG = { slot: card.dataset.slot, opt: card.dataset.opt, x0: e.clientX, y0: e.clientY, ghost: null, card };
});
document.addEventListener("pointermove", e => {
  if (!DRAG) return;
  if (!DRAG.ghost && Math.hypot(e.clientX - DRAG.x0, e.clientY - DRAG.y0) > 8) {
    DRAG.ghost = document.createElement("div"); DRAG.ghost.className = "drag-ghost"; DRAG.ghost.innerHTML = DRAG.card.querySelector(".pic").innerHTML; document.body.appendChild(DRAG.ghost);
    document.body.classList.add("dragging");
  }
  if (DRAG.ghost) { DRAG.ghost.style.left = e.clientX + "px"; DRAG.ghost.style.top = e.clientY + "px";
    const st = document.getElementById("stage"); if (st) { const r = st.getBoundingClientRect(); st.classList.toggle("over", e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom); } }
});
document.addEventListener("pointerup", e => {
  if (!DRAG) return;
  const d = DRAG; DRAG = null; document.body.classList.remove("dragging");
  if (d.ghost) { d.ghost.remove(); const st = document.getElementById("stage");
    if (st) { st.classList.remove("over"); const r = st.getBoundingClientRect(); if (e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom) { const D = design(), s = slot(mission(), d.slot); const sel = s.multi ? (D.picks[d.slot] || []).includes(d.opt) : D.picks[d.slot] === d.opt; if (!sel) pickPart(d.slot, d.opt); } } }
});

const pct = v => `${v >= 0 ? "+" : ""}${Math.round(v * 100)}%`;
const col = v => v >= 70 ? "var(--mint)" : v >= 45 ? "var(--sun)" : "var(--red)";

/* cumulative science data: actual vs plan, with event markers */
function dataChart(r, M) {
  const W = 640, H = 230, P = { l: 52, r: 16, t: 16, b: 34 };
  const tl = r.telemetry, days = tl.plannedDays;
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  // build the actual curve from the flight samples and scale it to the real total
  let cum = 0; const pts = [{ x: 0, y: 0 }];
  let prev = 0;
  (r.series.length ? r.series : [{ p: 1, rate: 1 }]).forEach(s => { cum += Math.max(0, s.rate) * (s.p - prev); prev = s.p; pts.push({ x: s.p, y: cum }); });
  const k = cum > 0 ? tl.dataGb / cum : 0;
  const maxY = Math.max(tl.dataPlanGb, tl.dataGb, 1) * 1.08;
  const X = p => P.l + p * iw, Y = v => P.t + ih - (v / maxY) * ih;
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p.x).toFixed(1)} ${Y(p.y * k).toFixed(1)}`).join(" ");
  const area = line + ` L${X(pts[pts.length - 1].x).toFixed(1)} ${Y(0)} L${X(0)} ${Y(0)} Z`;
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = maxY * i / 4; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.12)"/><text x="${P.l - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="#C9C2FF">${fmt(v)}</text>`; }
  for (let i = 0; i <= 4; i++) { const p = i / 4; g += `<text x="${X(p)}" y="${H - 12}" text-anchor="middle" font-size="11" fill="#C9C2FF">${T("day", "يوم")} ${Math.round(p * days)}</text>`; }
  g += `<path d="M${X(0)} ${Y(0)} L${X(1)} ${Y(tl.dataPlanGb)}" stroke="#C9C2FF" stroke-width="2" stroke-dasharray="6 6" fill="none"/>`;
  g += `<path d="${area}" fill="rgba(61,219,164,.18)"/><path d="${line}" stroke="#3DDBA4" stroke-width="3" fill="none" stroke-linejoin="round"/>`;
  r.marks.forEach(m => { const c = m.tone === "bad" ? "#FF5A5F" : m.tone === "warn" ? "#FFC83D" : "#3DDBA4"; g += `<line x1="${X(m.p)}" x2="${X(m.p)}" y1="${P.t}" y2="${Y(0)}" stroke="${c}" stroke-width="1.5" stroke-dasharray="2 4" opacity=".8"/><circle cx="${X(m.p)}" cy="${P.t + 4}" r="4" fill="${c}"/>`; });
  if (r.outcome === "lost") { const last = pts[pts.length - 1]; g += `<text x="${X(last.x) + 6}" y="${Y(0) - 8}" font-size="13" font-weight="800" fill="#FF5A5F">✖ ${T("lost", "فُقدت")}</text>`; }
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(T("Science data returned over the mission", "البيانات العلمية المُرسلة خلال المهمة"))}">${g}</svg>
    <div class="legend"><span><i style="background:#3DDBA4"></i>${T("Your mission (Gb)", "مهمتك (غيغابت)")}</span><span><i class="dash"></i>${T("Perfect plan", "الخطة المثالية")}</span><span><i style="background:#FF5A5F"></i>${T("problem", "مشكلة")}</span><span><i style="background:#FFC83D"></i>${T("warning", "تحذير")}</span><span><i style="background:#3DDBA4"></i>${T("good news", "خبر جيد")}</span></div>`;
}

/* launch margins vs the 10–30% target engineers aim for */
function marginChart(r) {
  const rows = [["mass", "⚖️", T("Weight", "الوزن")], ["power", "⚡", T("Power", "الطاقة")], ["battery", "🔋", T("Battery", "البطارية")], ["data", "📶", T("Data link", "رابط البيانات")], ["budget", "💰", T("Money left", "المال المتبقي")], ["time", "⏳", T("Time left", "الوقت المتبقي")]];
  const lo = -0.5, hi = 1, W = 640, rowH = 30, P = { l: 132, r: 60 };
  const X = v => P.l + (clamp(v, lo, hi) - lo) / (hi - lo) * (W - P.l - P.r);
  let g = `<rect x="${X(0.1)}" y="0" width="${X(0.3) - X(0.1)}" height="${rows.length * rowH}" fill="rgba(61,219,164,.14)"/><line x1="${X(0)}" x2="${X(0)}" y1="0" y2="${rows.length * rowH}" stroke="#fff" stroke-width="1.5"/>`;
  rows.forEach((row, i) => {
    const v = r.margins[row[0]], y = i * rowH;
    const c = v < 0 ? "#FF5A5F" : v < 0.1 ? "#FFC83D" : "#3DDBA4";
    const x0 = X(Math.min(0, v)), x1 = X(Math.max(0, v));
    g += `<text x="${P.l - 10}" y="${y + 20}" text-anchor="end" font-size="13" fill="#fff" font-weight="700">${row[1]} ${row[2]}</text><rect x="${x0}" y="${y + 7}" width="${Math.max(2, x1 - x0)}" height="16" rx="5" fill="${c}"/><text x="${x1 + 6}" y="${y + 20}" font-size="12.5" fill="#E4E0FF" font-weight="700">${pct(v)}</text>`;
  });
  g += `<text x="${(X(0.1) + X(0.3)) / 2}" y="${rows.length * rowH + 16}" text-anchor="middle" font-size="11.5" fill="#3DDBA4">${T("engineers’ target 10–30%", "هدف المهندسين 10–30%")}</text>`;
  return `<svg viewBox="0 0 ${W} ${rows.length * rowH + 24}" class="chart" role="img" aria-label="${esc(T("Margins at launch", "الهوامش عند الإطلاق"))}">${g}</svg>`;
}

/* plain-language analysis: strengths and what to improve next time */
function analysis(r, M, D) {
  const tips = [], good = [];
  const tl = r.telemetry, m = r.margins;
  if (r.outcome === "lost" && !M.open) tips.push(T("Your design repeated the real failure. Re-read the clues: the root cause can be fixed in the design or the tests.", "تصميمك كرّر الفشل الحقيقي. أعد قراءة الأدلة: السبب الجذري يمكن إصلاحه في التصميم أو الاختبارات."));
  if (m.mass < 0.1) tips.push(T(`Weight margin was ${pct(m.mass)}. Aim for 10–30%: lighter parts or a bigger rocket.`, `هامش الوزن كان ${pct(m.mass)}. استهدف 10–30%: قطع أخف أو صاروخ أكبر.`));
  if (m.power < 0.1) tips.push(T(`Power margin was ${pct(m.power)}. Solar cells age; keep at least 10–20% spare.`, `هامش الطاقة كان ${pct(m.power)}. الخلايا الشمسية تتقادم؛ احتفظ بـ 10–20% احتياطي.`));
  if (m.battery < 0.2) tips.push(T(`Battery spare was ${pct(m.battery)}. A battery fault would hurt: aim for 20%+.`, `احتياطي البطارية كان ${pct(m.battery)}. أي عطل في البطارية سيؤذي: استهدف 20% أو أكثر.`));
  if (tl.ratio < 1) tips.push(T(`The radio could send only ${Math.round(tl.ratio * 100)}% of the data produced. Use a faster radio, a bigger dish or more ground stations.`, `الراديو أرسل ${Math.round(tl.ratio * 100)}% فقط من البيانات المُنتجة. استخدم راديو أسرع أو طبقًا أكبر أو محطات أكثر.`));
  if (tl.down > 10) tips.push(T(`${tl.down} days were lost to problems. A backup computer and the stress test cut downtime.`, `ضاع ${tl.down} يومًا بسبب المشاكل. الحاسوب الاحتياطي واختبار الضغط يقللان التوقف.`));
  if (m.budget < 0.03 && m.budget >= 0) tips.push(T("You spent almost the whole budget: nothing left for surprises.", "أنفقت الميزانية كلها تقريبًا: لم يبقَ شيء للمفاجآت."));
  if (tl.testsAll && tl.tests / tl.testsAll < 0.5) tips.push(T(`Only ${tl.tests} of ${tl.testsAll} tests were run. Untested parts are where surprises live.`, `أُجري ${tl.tests} فقط من ${tl.testsAll} اختبارات. القطع غير المختبرة هي مكان المفاجآت.`));
  r.roles.forEach(row => {
    if (row.redMissed) tips.push(T(`${L(ROLES[row.role].name)} voted GO with a red flag in their own area. A real flight director would hold the launch.`, `${L(ROLES[row.role].name)} صوّت GO مع علامة حمراء في مجاله. مدير الطيران الحقيقي كان سيوقف الإطلاق.`));
    if (row.needless) tips.push(T(`${L(ROLES[row.role].name)} held the launch when their numbers were fine. Check before voting NO-GO.`, `${L(ROLES[row.role].name)} أوقف الإطلاق وأرقامه سليمة. راجع قبل التصويت NO-GO.`));
  });
  const miss = r.keys.filter(k => !k.ok).slice(0, 2);
  miss.forEach(k => tips.push(`${L(k.t)}: ${L(k.why)}`));
  if (tl.hints > 2) tips.push(T(`You used ${tl.hints} hints. Next time, try with fewer.`, `استخدمت ${tl.hints} تلميحات. في المرة القادمة جرّب بعدد أقل.`));
  const comp = [["perf", T("Mission result", "نتيجة المهمة")], ["sci", T("Science", "العلم")], ["dec", T("Smart decisions", "القرارات الذكية")], ["eff", T("Resource use", "استخدام الموارد")], ["team", G.crew.n > 1 ? T("Teamwork", "العمل الجماعي") : T("Self-checks", "المراجعة الذاتية")], ["chal", T("Level challenges", "تحديات المستوى")]];
  comp.filter(c => r[c[0]] >= 80).slice(0, 3).forEach(c => good.push(T(`${c[1]}: ${r[c[0]]}/100`, `${c[1]}: ${r[c[0]]}/100`)));
  r.roles.filter(row => row.caught).forEach(row => good.push(T(`${L(ROLES[row.role].name)} caught a real problem with a NO-GO.`, `${L(ROLES[row.role].name)} اكتشف مشكلة حقيقية بتصويت NO-GO.`)));
  if (tl.uptime >= 95 && r.outcome !== "lost") good.push(T(`Uptime ${tl.uptime}%: almost no time lost.`, `زمن التشغيل ${tl.uptime}%: لم يضع وقت تقريبًا.`));
  return { tips: tips.slice(0, 6), good: good.slice(0, 4) };
}

function vClosed(M, D) {
  const r = D.result; if (!r) return "";
  const tl = r.telemetry;
  const head = { success: T("Mission success!", "نجحت المهمة!"), rescued: T("Mission rescued!", "أُنقذت المهمة!"), partial: T("Partial success", "نجاح جزئي"), lost: T("Mission lost", "فُقدت المهمة") }[r.outcome];
  const atts = G.attempts[M.id] || [];
  const prev = atts.length > 1 ? atts[atts.length - 2] : null;
  const comp = [["perf", T("Mission result", "نتيجة المهمة"), 25], ["sci", T("Science", "العلم"), 20], ["dec", T("Smart decisions", "القرارات الذكية"), 20], ["eff", T("Resource use", "استخدام الموارد"), 15], ["team", G.crew.n > 1 ? T("Teamwork", "العمل الجماعي") : T("Self-checks", "المراجعة الذاتية"), 10], ["chal", T("Level challenges", "تحديات المستوى"), 10]];
  const bars = comp.map(c => { const v = r[c[0]], d = prev && prev[c[0]] != null ? v - prev[c[0]] : null;
    return `<div class="sbar"><span>${c[1]} <small class="muted">${c[2]}%</small></span><div class="mbar"><i style="width:${v}%;background:${col(v)}"></i></div><b>${v}</b>${d != null ? `<em class="${d > 0 ? "up" : d < 0 ? "down" : ""}">${d > 0 ? "▲" : d < 0 ? "▼" : "="}${d ? Math.abs(d) : ""}</em>` : "<em></em>"}</div>`; }).join("");
  const tiles = [
    ["📅", T("Days operating", "أيام التشغيل"), `${fmt(tl.daysOp)}`, T(`planned ${fmt(tl.plannedDays)}`, `المخطط ${fmt(tl.plannedDays)}`)],
    ["💾", T("Science data home", "بيانات علمية وصلت"), tl.dataPlanGb ? `${fmt(tl.dataGb)} Gb` : "–", tl.dataPlanGb ? T(`${Math.round(100 * tl.dataGb / tl.dataPlanGb)}% of the perfect plan`, `${Math.round(100 * tl.dataGb / tl.dataPlanGb)}% من الخطة المثالية`) : ""],
    ["⏱️", T("Uptime", "زمن التشغيل الفعلي"), `${tl.uptime}%`, T(`${tl.down} days lost to problems`, `${tl.down} يومًا ضاعت بسبب المشاكل`)],
    ["💰", T("Budget used", "الميزانية المستخدمة"), `${Math.round(100 * tl.cost / tl.budget)}%`, `${money(M, tl.cost)} / ${money(M, tl.budget)}`],
    ["⏳", T("Schedule", "الجدول الزمني"), `${fmt(tl.months, 1)}/${tl.deadline}`, T("months to launch", "شهرًا حتى الإطلاق")],
    ["🧪", T("Tests run", "الاختبارات المنفذة"), `${tl.tests}/${tl.testsAll}`, T(`${tl.swaps} design changes tried`, `${tl.swaps} تغييرًا في التصميم`)]
  ].map(t => `<div class="tile"><span class="te">${t[0]}</span><b>${t[2]}</b><span>${t[1]}</span><small>${t[3]}</small></div>`).join("");
  const ch = r.ch.map(c => `<li class="${c.ok ? "ok" : "no"}"><span class="mk">${c.ok ? "✓" : "✗"}</span><span><b>${L(c.t)}</b></span></li>`).join("");
  const roleRows = r.roles.map(row => `<tr><td>${ROLES[row.role].emoji} ${L(ROLES[row.role].name)}</td>${G.crew.n > 1 ? `<td>${esc(row.player)}</td>` : ""}<td>${row.acts}</td><td>${row.vote == null ? "–" : row.vote}</td><td>${row.calls}</td><td>${row.domain}</td><td><b style="color:${col(row.score)}">${row.score}</b></td></tr>`).join("");
  const share = r.share.length ? (() => { const sum = r.share.reduce((a, s) => a + s.n, 0) || 1; return `<div class="share"><b>${T("Who did the work", "من قام بالعمل")}</b>${r.share.map(s => `<div class="sbar"><span>${esc(s.player)}</span><div class="mbar"><i style="width:${Math.round(100 * s.n / sum)}%;background:var(--sky)"></i></div><b>${Math.round(100 * s.n / sum)}%</b><em></em></div>`).join("")}<p class="small muted">${T("Balanced teams score higher: everyone should own decisions.", "الفرق المتوازنة تحصل على نتيجة أعلى: يجب أن يملك الجميع قرارات.")}</p></div>`; })() : "";
  const an = analysis(r, M, D);
  const keys = r.keys.map(k => `<li class="${k.ok ? "ok" : "no"}"><span class="mk" aria-hidden="true">${k.ok ? "✓" : "✗"}</span><span><b>${L(k.t)}</b><span>${L(k.why)}</span></span></li>`).join("");
  const reqs = r.reqs.map(q => `<li class="${q.met ? "ok" : "no"}"><span class="mk" aria-hidden="true">${q.met ? "✓" : "✗"}</span><span><b>${L(q.t)}</b><span>${T("Proven by", "يُثبت بـ")}: ${L(VERIFY[q.v])}</span></span></li>`).join("");
  const hist = atts.map(a => `<span class="att">${T("Try", "محاولة")} ${a.n} · ${L(MODES[a.mode || "engineer"].name)}: ${[0, 1, 2].map(i => i < a.stars ? "⭐" : "☆").join("")} ${a.total}</span>`).join("");
  const H = M.history;
  const rows = H.rows.map(row => `<tr><td>${L(row[0])}</td><td>${L(row[1])}</td><td>${esc(yourChoice(M, D, row[2]))}</td></tr>`).join("");
  const lv = LEVEL_CASES[G.mode], li = lv.indexOf(M.id), next = li >= 0 && li + 1 < lv.length ? mission(lv[li + 1]) : null;
  return `<section class="closed-top">
      <div class="stars-big">${[0, 1, 2].map(i => `<span class="sb ${i < r.stars ? "on" : ""}" style="--d:${i * 0.25}s">${starSVG(i < r.stars)}</span>`).join("")}</div>
      <h1>${head}</h1><p class="total">${r.total}<small>/100</small></p>
      <p class="lvl">${T("Level", "المستوى")}: <b>${L(MODES[r.mode].name)}</b> · ${T("challenges", "التحديات")} ${r.ch.filter(c => c.ok).length}/${r.ch.length}</p>
      ${D.diag.done ? `<div class="earned">${badgeSVG(M.badge.color, M.badge.glyph)}<span>${L(M.badge.name)}</span></div>` : ""}
      ${hist ? `<div class="atts">${hist}</div>` : ""}
    </section>
    <div class="closed-grid">
      <div class="card"><h2>🏅 ${T("Level challenges", "تحديات المستوى")}</h2><ul class="keys">${ch}</ul></div>
      <div class="card"><h2>📊 ${T("Score breakdown", "تفاصيل النتيجة")}</h2>${bars}${prev ? `<p class="small muted">▲▼ ${T("compared with your last try", "مقارنة بمحاولتك السابقة")}</p>` : ""}</div>
    </div>
    <h2 class="sec">🛰️ ${T("Mission telemetry", "بيانات المهمة")}</h2><div class="tiles">${tiles}</div>
    <div class="closed-grid">
      <div class="card"><h3>💾 ${T("Science data sent home over time", "البيانات العلمية المُرسلة عبر الزمن")}</h3>${dataChart(r, M)}</div>
      <div class="card"><h3>⚖️ ${T("Margins at launch", "الهوامش عند الإطلاق")}</h3>${marginChart(r)}<p class="small muted">${T("Below zero means the spacecraft was over its limit. Too much margin wastes money.", "تحت الصفر يعني أن المركبة تجاوزت حدها. الهامش الكبير جدًا يهدر المال.")}</p></div>
    </div>
    <div class="card team"><h2>🤝 ${G.crew.n > 1 ? T("Teamwork analysis", "تحليل العمل الجماعي") : T("Role-by-role analysis", "تحليل كل دور")}</h2>
      <div class="tablewrap"><table class="roles-t"><thead><tr><th>${T("Role", "الدور")}</th>${G.crew.n > 1 ? `<th>${T("Player", "اللاعب")}</th>` : ""}<th>${T("Choices made", "الاختيارات")}</th><th>${T("Poll vote", "جودة التصويت")}</th><th>${T("In-flight calls", "قرارات الطيران")}</th><th>${T("Own area result", "نتيجة مجاله")}</th><th>${T("Score", "النتيجة")}</th></tr></thead><tbody>${roleRows}</tbody></table></div>
      <p class="small muted">${T("Poll vote: 100 = voted correctly for your own numbers; voting GO with a red flag scores 0; holding the launch with nothing wrong scores 40.", "جودة التصويت: 100 = صوّت بشكل صحيح وفق أرقامك؛ التصويت GO مع علامة حمراء = 0؛ إيقاف الإطلاق دون مشكلة = 40.")}</p>${share}</div>
    <div class="closed-grid">
      <div class="card"><h2>💪 ${T("What you did well", "ما أحسنت فيه")}</h2>${an.good.length ? `<ul class="plain">${an.good.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : `<p class="muted">${T("Keep going: your strengths will show up here.", "استمر: ستظهر نقاط قوتك هنا.")}</p>`}</div>
      <div class="card"><h2>🎯 ${T("How to improve next time", "كيف تتحسن في المرة القادمة")}</h2>${an.tips.length ? `<ol class="plain">${an.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ol>` : `<p>${T("Nothing major. Try a harder level!", "لا شيء كبير. جرّب مستوى أصعب!")}</p>`}</div>
    </div>
    <div class="closed-grid">
      <div class="card"><h2>${T("Why it went this way", "لماذا حدث هذا")}</h2><ul class="keys">${keys}</ul></div>
      <div class="card"><h2>📜 ${T("Mission rules check", "مراجعة قواعد المهمة")}</h2><ul class="keys">${reqs}</ul></div>
    </div>
    <article class="casefile"><span class="stamp big">${M.open ? T("YOUR FILE", "ملفك") : L(M.stamp)}</span>
      <h2>${M.open ? T("Your case file", "ملف قضيتك") : T("What really happened", "ماذا حدث فعلًا")}</h2>
      ${M.open ? "" : `<p class="verdict-line ${r.outcome === "lost" ? "bad" : "ok"}">${r.outcome === "lost" ? T("Your crew repeated history.", "فريقك كرر التاريخ.") : T("Your crew changed the ending!", "فريقك غيّر النهاية!")}</p>`}
      <p>${L(H.story)}</p>
      ${rows ? `<table><thead><tr><th>${T("Decision", "القرار")}</th><th>${T("Real mission", "المهمة الحقيقية")}</th><th>${T("Your crew", "فريقك")}</th></tr></thead><tbody>${rows}</tbody></table>` : ""}
      <p class="lesson">💡 ${L(H.lesson)}</p><p class="src">${T("Source", "المصدر")}: ${L(H.source)} ${T("Game numbers are simplified.", "أرقام اللعبة مبسطة.")}</p></article>
    <div class="navrow"><button type="button" class="btn ghost" data-act="cases">◂ ${T("All cases", "كل القضايا")}</button>
      <button type="button" class="btn" data-act="retry">🔁 ${T("Redesign and fly again", "أعد التصميم وأطلق مجددًا")}</button>
      ${next ? `<button type="button" class="big-btn sm" data-act="open" data-id="${next.id}">${T("Next case", "القضية التالية")}: ${L(next.title)} ▸</button>` : `<button type="button" class="big-btn sm" data-act="cases">${T("Back to the cases", "العودة للقضايا")}</button>`}</div>`;
}

</script>
</body>
</html>
